name: 기업 채용페이지 변경 감지

on:
  schedule:
    # UTC 22:30 = 한국시간 07:30 (사람인 갱신 08:00 이전)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 준비
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 페이지 변경 확인
        id: watch
        run: |
          set +e
          python scripts/watch_pages.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "기업 채용페이지 변경 감지 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - name: 실패 알림
        if: steps.watch.outputs.code != '0'
        run: |
          echo "모든 페이지 접속에 실패했습니다. 위 '페이지 변경 확인' 단계 로그를 확인하세요."
          exit 1
