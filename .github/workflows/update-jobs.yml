name: 채용공고 자동 업데이트

on:
  schedule:
    # GitHub 시간은 UTC 기준입니다. 22:40 UTC = 한국시간 07:40
    # (GitHub 예약 실행은 10~30분 늦게 시작되는 경우가 많아, 8시 전에 끝나도록 조금 앞당겨 둡니다)
    - cron: "40 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 [Run workflow] 버튼으로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 채용공고 수집 (공공기관 + 민간기업)
        id: fetch
        env:
          ALIO_API_KEY: ${{ secrets.ALIO_API_KEY }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
        run: |
          set +e
          python scripts/fetch_jobs.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "채용공고 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 수집 실패 알림
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "일부 또는 전체 출처 수집에 실패했습니다. 위 '채용공고 수집' 단계 로그를 확인하세요."
          exit 1
