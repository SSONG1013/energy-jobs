name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - env:
          K: ${{ secrets.ALIO_API_KEY }}
        run: |
          ENC=$(python3 -c 'import os,urllib.parse as u;k=os.environ["K"].strip();print(u.quote(k,safe=""))')
          B="https://apis.data.go.kr/1760000/PblJobService/getList?serviceKey=$ENC&Pblanc_ty=&Instt_se=&Sort_order="
          t(){ echo "== $1"; curl -s -o /tmp/o -w "http=%{http_code} time=%{time_total}s\n" -m 100 "$B&$1"; grep -o '<totalCount>[^<]*' /tmp/o; grep -o '<regdate>[^<]*' /tmp/o | head -3 | tr '\n' ' '; echo; }
          t "pageNo=1&numOfRows=5&Begin_de=2026-10-01&End_de=2026-11-07"
          t "pageNo=1&numOfRows=5&Begin_de=20261001&End_de=20261107"
          t "pageNo=1&numOfRows=100&Begin_de=2026-10-01&End_de=2026-11-07"
          t "pageNo=5880&numOfRows=50"
          t "pageNo=2940&numOfRows=100"
