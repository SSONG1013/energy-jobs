name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ALIO_API_KEY }}
        run: |
          echo "key length: ${#K}"; case "$K" in *%*) echo "key looks URL-encoded";; *) echo "key looks decoded";; esac
          ENC=$(python3 -c 'import os,urllib.parse as u;k=os.environ["K"].strip();k=u.unquote(k) if "%" in k else k;print(u.quote(k,safe=""))')
          for ua in "Mozilla/5.0" "energy-jobs-board/1.0"; do
            echo "== UA: $ua"
            curl -s -o /tmp/o -w "%{http_code}\n" -m 20 -A "$ua" -H "Accept: application/json" "https://apis.data.go.kr/1051000/recruitment/list?serviceKey=$ENC&pageNo=1&numOfRows=2&ongoingYn=Y"
            head -c 600 /tmp/o; echo
          done
