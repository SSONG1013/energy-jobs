<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원자력·방사선 미니게임</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--navy:#14213d;--accent:#fca311;--line:#e3e7ee;--muted:#5d6676;--bg:#f4f6fa;--blue:#0b4f8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1c2433;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:18px 16px 14px}
header .in{max-width:760px;margin:0 auto}
h1{margin:0;font-size:20px}
.sub{margin:4px 0 0;font-size:13px;color:#b9c3d6}
.tag{display:inline-block;background:var(--accent);color:#3b2d00;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
main{max-width:760px;margin:0 auto;padding:14px 12px 30px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:700;color:#33415c;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:12px;align-items:start}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stage{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:320/400;border-radius:10px;overflow:hidden;background:#0d1b2e;touch-action:none;user-select:none}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:rgba(8,16,30,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:8px}
.ov[hidden]{display:none}
.ov h2{margin:0;font-size:20px}
.ov p{margin:0;font-size:13px;line-height:1.6;color:#d3dbea}
.big{font-size:38px;font-weight:800;color:var(--accent);line-height:1.1}
.btn{border:0;background:var(--accent);color:#3b2d00;font-weight:800;font-size:15px;border-radius:10px;padding:10px 22px;cursor:pointer}
.btn.ghost{background:#fff2;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.nick{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.nick input{width:150px;border:1px solid #556;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:#111}
.ctl{display:flex;gap:8px;margin-top:10px}
.ctl button{flex:1;border:1px solid var(--line);background:#eef2f7;border-radius:10px;padding:14px 4px;font-size:14px;font-weight:700;color:#1c2433;touch-action:none;user-select:none;cursor:pointer}
.ctl button:active,.ctl button.on{background:var(--accent);border-color:var(--accent)}
.ctl small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.hint{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
h3{margin:0 0 2px;font-size:15px}
.month{font-size:12px;color:var(--muted);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);font-weight:600;border-top:0}
td.r{width:34px;font-weight:800;color:var(--blue)}
td.s,th.s{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
td.d{width:48px;color:var(--muted);font-size:12px;text-align:right}
tr.me td{background:#fff7e0}
tr.top1 td.r{color:#c98500}
.demo{font-size:10px;color:#8a94a6;margin-left:4px}
.empty{padding:20px 0;text-align:center;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
.tab{font-size:13px}
.hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;color:#fff;font-size:12px;line-height:1.5;background:linear-gradient(#000b,#0000);pointer-events:none;z-index:2}
.hud[hidden],.vig[hidden],.snd[hidden]{display:none}
.hud .row{display:flex;justify-content:space-between;gap:6px}
.hud .bar{height:8px;background:#fff3;border-radius:4px;overflow:hidden;margin:3px 0}
.hud .bar i{display:block;height:100%;width:0;background:#fca311}
.mt{position:absolute;left:8px;right:84px;bottom:8px;z-index:3;background:#b9cba3;border:3px solid #3b4a2c;border-radius:10px;padding:5px 9px;color:#1b2a10;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}
.mt .mm{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700}
.mt small{font-weight:400;opacity:.65;font-size:10px}
.mt .mv{display:flex;align-items:baseline;gap:6px}
.mt .mv b{font-size:28px;line-height:1.1;letter-spacing:1px}
.mt .mv span{font-size:12px}
.mt .mb{height:6px;background:#8fa27a;border-radius:3px;overflow:hidden;margin-top:2px}
.mt .mb i{display:block;height:100%;width:0;background:#26421a}
.ctl.wrap{flex-wrap:wrap}
.ctl.wrap button{flex:1 1 22%}
.ctl.wrap button.w2{flex:1 1 45%}
#hMsg{color:#ffd88a;min-height:18px}
.vig{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,#0000 45%,#ff2a2a 130%);opacity:0}
.snd{position:absolute;right:8px;bottom:8px;z-index:2;border:0;background:#0008;color:#fff;font-size:11px;border-radius:8px;padding:5px 9px;cursor:pointer}
#stage .three{position:absolute;inset:0;width:100%;height:100%;display:block}
footer{margin-top:18px;font-size:12px;color:#93a1b5;line-height:1.6}
.gnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.gnav a{text-decoration:none;border:1px solid rgba(255,255,255,.25);color:#dbe3ee;border-radius:999px;padding:5px 13px;font-size:14px}.gnav a.on{background:var(--accent);border-color:var(--accent);color:#3b2d00;font-weight:650}
</style>
</head>
<body>
<header><div class="in">
<h1>원자력·방사선 미니게임</h1>
<p class="sub">게임 3종 · 점수를 겨루고 이번 달 TOP 10에 이름을 올려보세요 · 랭킹은 매월 1일 새로 시작합니다</p>
<nav class="gnav"><a href="./">채용공고</a><a href="./news.html">뉴스</a><a href="./labs.html">대학원·연구실</a><a class="on" href="./games.html">게임</a></nav>
</div></header>
<main>
<div class="tabs">
<button class="tab" id="tab-rod" aria-pressed="true">1. 제어봉 게임</button>
<button class="tab" id="tab-shield" aria-pressed="false">2. 차폐 디펜스</button>
<button class="tab" id="tab-zone" aria-pressed="false">3. 방사선원 찾기 (1인칭)</button>
</div>
<div class="grid">
<section class="card">
<div class="stage" id="stage">
<canvas id="cv" width="640" height="800"></canvas>
<div class="vig" id="vig" hidden></div>
<div class="hud" id="hud" hidden>
<div class="row"><span id="hFloor"></span><span id="hTime"></span></div>
<div id="hMsg"></div>
</div>
<div class="mt" id="mt" hidden>
<div class="mm"><span id="mMode"></span><small>탭하면 전환</small></div>
<div class="mv"><b id="mVal">0.00</b><span id="mUnit"></span></div>
<div class="mb"><i id="mBar"></i></div>
</div>
<button class="snd" id="snd" hidden>소리 켜짐</button>
<div class="ov" id="ovStart">
<h2 id="stTitle"></h2>
<p id="stRules"></p>
<button class="btn" id="btnStart">시작하기</button>
</div>
<div class="ov" id="ovEnd" hidden>
<h2 id="enTitle"></h2>
<div class="big" id="enScore">0</div>
<p id="enMsg"></p>
<div class="nick" id="nickBox">
<input id="nick" maxlength="10" placeholder="닉네임 (2~10자)" autocomplete="off">
<button class="btn" id="btnSubmit">랭킹 등록</button>
</div>
<p id="subMsg"></p>
<button class="btn ghost" id="btnRetry">다시 하기</button>
</div>
</div>
<div class="ctl" id="ctlRod">
<button id="bUp">제어봉 인출 ▲<small>출력 상승 · ↑키</small></button>
<button id="bDown">제어봉 삽입 ▼<small>출력 하강 · ↓키</small></button>
</div>
<div class="ctl" id="ctlShield" hidden>
<button data-s="0">종이<small>1키</small></button>
<button data-s="1">알루미늄<small>2키</small></button>
<button data-s="2">납<small>3키</small></button>
<button data-s="3">물(붕산수)<small>4키</small></button>
</div>
<div class="ctl wrap" id="ctlZone" hidden>
<button data-m="l">◀<small>좌회전 A</small></button>
<button data-m="f">▲ 전진<small>W / ↑</small></button>
<button data-m="r">▶<small>우회전 D</small></button>
<button data-m="b">▼ 후진<small>S / ↓</small></button>
<button data-m="pu" class="w2">시선 위로 ⤒<small>R 키 · 드래그</small></button>
<button data-m="pd" class="w2">시선 아래로 ⤓<small>F 키 · 드래그</small></button>
<button id="bMeter" class="w2">계측기 전환<small>Q 키</small></button>
<button id="bGrab" class="w2">방사선원 확인<small>E / 스페이스</small></button>
</div>
<p class="hint" id="hint"></p>
</section>
<section class="card">
<h3 id="lbTitle">이번 달 TOP 10</h3>
<p class="month" id="lbMonth"></p>
<div id="lbBody"></div>
</section>
</div>
<footer>※ 랭킹은 현재 이 브라우저에만 저장되며, 처음 보이는 일부 점수는 예시입니다.<br>해당 사이트는 AI를 기반으로 검색된 자료입니다. 참고자료만으로 활용하시길 바랍니다. 게임 속 선량·방사선 수치는 이해를 돕기 위한 가상값이며 실제와 다릅니다.</footer>
</main>
