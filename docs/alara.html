<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALARA — 방사선안전관리자의 5년</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1013;--panel:#161b1f;--line:#2b3439;--text:#e7ecee;--muted:#93a1a8;--amber:#f5b400;--red:#ff5d4f;--green:#4fd18b;--blue:#6cb6ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:560px;padding:10px 10px 0;flex:1}
  header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  header h1{font-family:"DotGothic16",monospace;font-size:20px;margin:0;letter-spacing:1px;color:var(--amber)}
  header small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
  .hb .ibtn{padding:6px 7px}
  .hb{margin-left:auto;display:flex;gap:5px}
  .ibtn{background:#1e2529;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit;cursor:pointer}
  .ibtn.on{border-color:var(--amber);color:var(--amber)}

  .hud{display:grid;gap:5px;margin-bottom:5px}
  .h4{grid-template-columns:repeat(4,1fr)}.h3{grid-template-columns:repeat(3,1fr)}
  .m{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
  .m .t{white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--muted);gap:2px}
  .m .t b{color:var(--text);font-family:"DotGothic16",monospace;font-weight:400;font-size:10.5px;white-space:nowrap}
  .m.big .t{font-size:10px}.m.big .t b{font-size:12px}
  .bar{height:5px;background:#07090b;border-radius:3px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;width:0;transition:width .5s,background .5s}
  .stats{display:flex;gap:8px;margin:2px 0 8px;font-size:11px;color:var(--muted);align-items:center}
  .stats span b{color:var(--text);font-family:"DotGothic16",monospace;font-weight:400;font-size:13px;margin-left:3px}
  .stats .clock{margin-left:auto;color:var(--amber);font-family:"DotGothic16",monospace;font-size:12px}

  .screen{position:relative;border:3px solid #39424a;border-radius:6px;overflow:hidden;background:#000}
  canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  .fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .fade.on{opacity:1}
  .fade .yr{font-family:"DotGothic16",monospace;color:var(--amber);font-size:30px;letter-spacing:2px}
  .fade .st{color:#dfe6ff;font-size:14px;margin-top:6px;font-weight:700}
  .loc{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);color:#fff;font-family:"DotGothic16",monospace;font-size:11px;padding:2px 7px;border-radius:4px}

  .msg{margin-top:8px;min-height:150px;background:linear-gradient(#1b2a52,#0f1836);border:3px solid #dfe6ff;border-radius:8px;padding:12px 14px 14px;position:relative;cursor:pointer;user-select:none}
  .name{position:absolute;top:-14px;left:10px;background:#0f1836;border:2px solid #dfe6ff;border-radius:5px;padding:1px 9px;font-size:12px;font-weight:700;color:#ffe27a}
  .mtext{font-size:15px;line-height:1.75;white-space:pre-line;min-height:52px}
  .cursor{position:absolute;right:12px;bottom:6px;color:#fff;animation:blink .8s infinite;font-size:12px}
  @keyframes blink{50%{opacity:0}}
  .q{font-size:13px;color:#b9c6ef;margin-bottom:6px}
  .ch{display:block;width:100%;text-align:left;background:transparent;border:0;color:#fff;font-family:inherit;font-size:14.5px;line-height:1.5;padding:7px 6px 7px 24px;position:relative;border-radius:5px;cursor:pointer}
  .ch:hover,.ch:focus{background:rgba(255,255,255,.08);outline:none}
  .ch::before{content:"▶";position:absolute;left:6px;top:8px;font-size:10px;color:#ffe27a;opacity:0}
  .ch:hover::before,.ch:focus::before{opacity:1}
  .ch.lock{color:#7d88a8;cursor:not-allowed}.ch.sp{color:#ffe27a}
  .ch small{display:block;font-size:11px;color:#9aa6cc}
  .deltas{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .d{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 7px}
  .d.g{background:#123d27;color:#7ef0ad}.d.b{background:#4a1714;color:#ff9b91}
  table.rec{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
  table.rec th,table.rec td{border-bottom:1px solid rgba(223,230,255,.18);padding:4px 4px;text-align:right}
  table.rec th:first-child,table.rec td:first-child{text-align:left;color:#b9c6ef;font-weight:500}
  table.rec th{color:#9aa6cc;font-weight:500;font-size:11px}
  .ok{color:#7ef0ad}.warn{color:#ffd27a}.over{color:#ff7b70;font-weight:700}
  .end h2{margin:2px 0 6px;font-size:19px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;color:#111}
  .btn{background:#ffe27a;color:#111;border:0;border-radius:7px;padding:10px 14px;font-weight:900;font-family:inherit;font-size:14px;cursor:pointer;margin-top:8px}

  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:#2a230a;border:1px solid var(--amber);color:var(--amber);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:40;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:30}
  .modal.open{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 26px}
  .sheet h2{margin:0 0 4px;font-size:18px}.sheet .sub{margin:0 0 12px;color:var(--muted);font-size:12px}
  .entry{background:#1e2529;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .entry b{font-size:14px}.entry p{margin:4px 0 0;font-size:13px;line-height:1.6;color:#c6d0d4}
  .entry.lock b{color:var(--muted)}.entry.lock p{color:#58656b}
  footer{width:100%;max-width:560px;padding:14px 12px 22px;text-align:center;border-top:1px solid var(--line);margin-top:12px}
  .views{font-size:12px;color:var(--muted);margin-bottom:6px}.views b{color:var(--amber)}
  .reg{margin-top:10px;background:rgba(0,0,0,.25);border-radius:8px;padding:10px}
  .reg .sc{font-size:22px;font-weight:900;color:#ffe27a;font-family:"DotGothic16",monospace}
  .reg input{width:100%;margin-top:8px;padding:9px 10px;border-radius:7px;border:1px solid #6b78a8;background:#0b1230;color:#fff;font-family:inherit;font-size:14px}
  .reg .row{display:flex;gap:6px}.reg .row .btn{flex:1}
  .btn.sub{background:#2c3a6b;color:#fff}
  .rk{display:flex;align-items:center;gap:10px;background:#1e2529;border-radius:9px;padding:9px 11px;margin-bottom:6px;font-size:13px}
  .rk .no{width:26px;font-weight:900;color:var(--amber);font-family:"DotGothic16",monospace;font-size:15px}
  .rk .nm{flex:1;min-width:0}.rk .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .nm small{color:var(--muted)}
  .rk .pt{font-weight:900;font-family:"DotGothic16",monospace;font-size:15px}
  .rk.me{outline:1px solid var(--amber)}
  .disc{font-size:10.5px;color:#6f7d83;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>☢ ALARA</h1><small>방사선안전관리자의 5년 · 선택형 RPG</small></div>
    <div class="hb">
      <button class="ibtn" id="bSnd">🔊</button>
      <button class="ibtn" id="bFast">⏩</button>
      <button class="ibtn" id="bRank">🏆</button>
      <button class="ibtn" id="bDex">📘</button>
      <button class="ibtn" id="bReset">↺</button>
    </div>
  </header>

  <div class="hud h4">
    <div class="m big"><div class="t">연간<b id="tEff">0</b></div><div class="bar"><i id="bEff"></i></div></div>
    <div class="m big"><div class="t">5년<b id="tCum">0</b></div><div class="bar"><i id="bCum"></i></div></div>
    <div class="m"><div class="t">👷 집단<b id="tCrew">0</b></div><div class="bar"><i id="bCrew"></i></div></div>
    <div class="m"><div class="t">⏱ 공정<b id="tDelay">0</b></div><div class="bar"><i id="bDelay"></i></div></div>
  </div>
  <div class="hud h3">
    <div class="m"><div class="t">👁 수정체<b id="tLens">0</b></div><div class="bar"><i id="bLens"></i></div></div>
    <div class="m"><div class="t">🖐 피부<b id="tSkin">0</b></div><div class="bar"><i id="bSkin"></i></div></div>
    <div class="m"><div class="t">🦶 손·발<b id="tExt">0</b></div><div class="bar"><i id="bExt"></i></div></div>
  </div>
  <div class="stats">
    <span>전문성<b id="sExp">0</b></span><span>신뢰도<b id="sTrust">0</b></span><span>침착함<b id="sCalm">0</b></span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="screen">
    <canvas id="cv" width="240" height="160"></canvas>
    <div class="loc" id="loc"></div>
    <div class="fade" id="fade"><div class="yr" id="fYr"></div><div class="st" id="fSt"></div></div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<footer>
  <div class="disc">제작자: ssong (okmyway4@naver.com)<br>선량한도는 국내 방사선작업종사자 기준을 반영했지만, 사건별 선량 수치와 절차는 게임용으로 단순화한 허구입니다. 실제 업무는 관련 법령과 사업장 절차를 따르세요.</div>
</footer>

<div class="toast" id="toast"></div>
<div class="modal" id="rank"><div class="sheet">
  <button class="ibtn" style="float:right" id="rankX">닫기</button>
  <h2>🏆 시즌 점수판</h2><p class="sub" id="rankSub"></p><div id="rankList"></div>
</div></div>
<div class="modal" id="dex"><div class="sheet">
  <button class="ibtn" style="float:right" id="dexX">닫기</button>
  <h2>📘 현장 도감</h2><p class="sub" id="dexSub"></p><div id="dexList"></div>
</div></div>

<script>
/* =====================================================================
   1. 선량한도 (방사선작업종사자, 단위 mSv)
   ===================================================================== */
const LIMIT = { eff:50, cum:100, lens:150, skin:500, ext:500, crew:25, delay:100 };
const LABEL = { eff:"유효선량", lens:"수정체", skin:"피부", ext:"손·발", crew:"집단선량", delay:"공정지연", exp:"전문성", trust:"신뢰도", calm:"침착함" };
const UNIT  = { eff:" mSv", lens:" mSv", skin:" mSv", ext:" mSv", crew:" 맨·mSv", delay:"%" };
const BAD = new Set(["eff","lens","skin","ext","crew","delay"]);

/* 연차 구성: routine = 그 해 일상 업무로 쌓이는 선량 */
const YEARS = [
  { first:"p1",   title:"1년차", sub:"조선소 비파괴검사 현장", routine:{eff:2, ext:5} },
  { first:"c2_1", title:"2년차", sub:"원자력발전소 계획예방정비", routine:{eff:8, ext:10, skin:5} },
  { first:"c3_1", title:"3년차", sub:"운반 · 동위원소 시설 · 규제 검사", routine:{eff:3, ext:10, lens:5} },
  { first:"c4_1", title:"4년차", sub:"선원 분실 비상 대응", routine:{eff:3, ext:5} },
  { first:"c5_1", title:"5년차", sub:"선배가 된다는 것", routine:{eff:4, ext:5} }
];

const DEX = {
  survey:{name:"서베이미터",desc:"공간 선량률을 실시간으로 재는 휴대용 측정기. 배터리만이 아니라 교정 유효기간과 응답 확인까지가 사용 전 점검이다."},
  dosimeter:{name:"개인선량계",desc:"작업자의 누적 선량을 공식 기록하는 장비. 보통 몸통 앞쪽에 착용한다. 주머니 속이나 몸 뒤쪽은 실제 피폭을 제대로 반영하지 못한다."},
  limits:{name:"선량한도",desc:"방사선작업종사자 기준: 유효선량 연간 50 mSv 이하이면서 5년 누적 100 mSv 이하, 수정체 등가선량 연간 150 mSv, 피부·손발 등가선량 각각 연간 500 mSv. 한 해를 무사히 넘겨도 5년 누적이 남는다. 참고로 ICRP는 2011년 수정체 한도를 연간 20 mSv(5년 평균) 수준으로 낮추도록 권고했다."},
  zone:{name:"통제구역 설정",desc:"경험이나 감이 아니라 측정값으로 경계를 정한다. 표지만으로는 부족하고 통제선과 감시가 함께 있어야 한다."},
  tds:{name:"시간·거리·차폐",desc:"외부피폭 방호 3원칙. 짧게, 멀리, 차폐체 뒤에서. 위험한 순간일수록 먼저 노출을 멈추는 것이 우선이다."},
  source:{name:"선원 미회수",desc:"RT 후 선원이 차폐 용기로 돌아가지 않은 상태. 눈으로는 알 수 없고 측정으로만 확인된다. 의심되면 접근하지 말고 거리를 둔 채 측정·통제·보고한다."},
  extremity:{name:"손·발 등가선량",desc:"선원을 손으로 다루면 몸 전체보다 손이 훨씬 많이 피폭된다. 유효선량은 괜찮아도 손 한도(연 500 mSv)를 먼저 넘을 수 있다. 원격 집게, 긴 도구, 반지형 선량계가 쓰이는 이유다."},
  report:{name:"정확한 보고",desc:"'엄청 높다'가 아니라 '어디서, 몇 m에서, 얼마'. 숫자와 위치가 있어야 대응팀이 판단할 수 있다."},
  alara:{name:"ALARA",desc:"합리적으로 달성 가능한 한 낮게. 핵심은 'Reasonably'. 가장 느린 방법이 늘 정답은 아니다. 안전과 작업을 함께 설계하는 것이 실력이다."},
  record:{name:"기록의 무게",desc:"선량 기록과 사고 보고서는 작업자를 지키는 증거다. 빠뜨리거나 축소한 기록은 나중에 더 큰 문제로 돌아온다."},
  collective:{name:"집단선량",desc:"작업에 참여한 모든 사람의 선량을 더한 값(맨·mSv). 인원을 늘려 1인당 선량을 낮춰도 집단선량은 오히려 늘 수 있다."},
  contam:{name:"신체 오염",desc:"방사성물질이 몸이나 옷에 묻은 상태. 퇴장 시 오염감시기 경보는 '오작동'으로 단정하지 말고 재측정·제염·기록한다."},
  decon:{name:"피부 제염",desc:"미지근한 물과 중성세제로 부드럽게 씻는다. 세게 문지르거나 알코올로 닦으면 피부가 상해 오히려 흡수가 늘 수 있다. 피부 선량은 평가해 기록한다."},
  apd:{name:"경보선량계(APD)",desc:"설정 선량에 도달하면 경보가 울리는 전자식 선량계. 경보는 '서둘러 끝내라'가 아니라 '나와라'는 신호다."},
  transport:{name:"방사성물질 운반",desc:"운반물은 포장 표면 선량률과 운반지수 기준을 만족해야 출발할 수 있다. 기준 근처라고 서류만 맞추는 건 위반이다."},
  lens:{name:"수정체 방호",desc:"베타선과 근거리 작업에서 눈은 쉽게 피폭된다. 납 보안경과 안면 보호구, 원격 조작창을 쓰는 이유다. 수정체 피폭은 백내장 위험과 연결된다."},
  emergency:{name:"선원 분실 대응",desc:"분실·도난을 알면 지체 없이 보고하고, 이동 경로를 역추적한다. 발견하면 만지지 말고 거리를 두고 측정·통제한다. 늑장 보고는 공중 피폭을 키운다."},
  risk:{name:"위험 소통",desc:"'괜찮다'고 단정하지도, 답을 피하지도 않는다. 측정값과 범위, 앞으로의 조치를 사실대로 설명하고 상담 창구를 연결한다."},
  mentor:{name:"교육과 전수",desc:"대신 해주는 것은 가르치는 것이 아니다. 직접 해보게 하고 이유를 설명할 때 후배가 성장한다."}
};

/* =====================================================================
   2. 시나리오
   act: say(이름,대사) move(id,x,y[,false]) show(id,x,y) hide(id) bubble(id,기호)
        float(id,글자,색) line(none|near|far|wide) src(in|out|fire) alarm shield truck
        shake flash wait skip(시각)
   fx : eff(유효) lens skin ext crew delay exp trust calm
   ===================================================================== */
const FIELD = { player:[13,9], banjang:[12,9], rt:[1,8], helper:[2,9] };
const SCENES = {
/* ---------------- 1년차 ---------------- */
p1:{ loc:"본사 방사선안전팀", time:"3/2 09:00",
  setup:{ map:"office", actors:{ player:[7,9], senior:[4,4] } },
  intro:[["move","player",6,5],["bubble","senior","!"]],
  text:"입사 첫날. 박 선배가 노란 케이스 하나를 책상 위에 올려놓는다.",
  speaker:"박 선배", quote:"오늘부터 우리 팀이네. 이건 네 서베이미터야. 현장 가기 전에 뭘 해둘래?",

/* 선택지 무작위 구성: 일반 선택지 중 3개만 뽑고(안전한 선택 최소 1개 보장), 문구와 선량도 매번 조금씩 다르게 */
const SHOW = 3;
const heur = c => { const f=c.fx||{}; return (f.exp||0)+(f.trust||0)+(f.calm||0)-(f.eff||0)/3-(f.crew||0)/4-(f.lens||0)/30-(f.skin||0)/40-(f.ext||0)/40-(f.delay||0)/40-(c.flag&&!["mentor","confessed","fixedT","legacyMeasure","legacyRecord","legacyPeople"].includes(c.flag)?3:0); };
const JITTER = { eff:1, lens:1, skin:1, ext:1, crew:1 };
function rollChoices(sc){
  const reg=sc.choices.map((c,i)=>i).filter(i=>!sc.choices[i].req), sp=sc.choices.map((c,i)=>i).filter(i=>sc.choices[i].req);
  let pick=reg;
  if(reg.length>SHOW){
    for(let n=0;n<30;n++){ pick=shuffle(reg.slice()).slice(0,SHOW); if(pick.some(i=>heur(sc.choices[i])>0)) break; }
  }
  return shuffle([...pick,...sp]).map(i=>{
    const c=sc.choices[i], texts=[c.t,...(c.alt||[])], fx={};
    for(const k in (c.fx||{})){ const v=c.fx[k]; fx[k]= JITTER[k] && v>=1 ? (k==="eff"? Math.round(v*(0.85+Math.random()*0.3)*10)/10 : Math.round(v*(0.85+Math.random()*0.3))) : v; }
    return { i, text:texts[Math.floor(Math.random()*texts.length)], fx };
  });
}

function stepActor(a){

  const [tx,ty]=a.path[0], gx=tx*T, gy=ty*T, v=1.6/speed, dx=gx-a.px, dy=gy-a.py;
  if(Math.abs(dx)<=v&&Math.abs(dy)<=v){ a.px=gx; a.py=gy; a.x=tx; a.y=ty; a.path.shift(); if(a.visible) SFX.step(a.id==="player"?0.09:0.04); if(!a.path.length&&a.done){ const d=a.done; a.done=null; d(); } }
  else { a.px+=Math.sign(dx)*Math.min(v,Math.abs(dx)); a.py+=Math.sign(dy)*Math.min(v,Math.abs(dy)); }
}
function moveTo(id,x,y){
  const a=actors[id]; if(!a) return Promise.resolve();
  const path=[]; let cx=a.x, cy=a.y;
  while(cx!==x){ cx+=Math.sign(x-cx); path.push([cx,cy]); }
  while(cy!==y){ cy+=Math.sign(y-cy); path.push([cx,cy]); }

}

  drawLine(); drawTruck();
  for(const id in actors) stepActor(actors[id]);
  Object.values(actors).filter(a=>a.visible).sort((a,b)=>a.py-b.py).forEach(a=>drawPerson(a,t));
  lighting(); radiation(t); ambience(t);
  if(S.world.alarm && Math.floor(t/400)%2){ ctx.strokeStyle="rgba(255,60,40,.9)"; ctx.lineWidth=3; ctx.strokeRect(1,1,238,158); }
  Object.values(actors).forEach(a=>{ if(a.bubble&&a.bubble.until<t) a.bubble=null; if(a.visible) drawBubble(a); });
  floats=floats.filter(f=>t-f.t0<1500);
  floats.forEach(f=>{ const k=(t-f.t0)/1500; ctx.globalAlpha=1-k; ctx.font="bold 8px sans-serif"; ctx.textAlign="center"; ctx.lineWidth=3; ctx.strokeStyle="#000"; ctx.strokeText(f.txt,f.x,f.y-k*14); ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y-k*14); ctx.globalAlpha=1; ctx.textAlign="left"; });

const AU = { ctx:null, master:null, bgm:null, sfx:null, noise:null,
  mode:(()=>{ try{ return localStorage.getItem("alara_snd")||"all"; }catch(e){ return "all"; } })() };
function auInit(){
  if(AU.ctx){ if(AU.ctx.state==="suspended") AU.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const c=AU.ctx=new C();
  AU.master=c.createGain(); AU.master.connect(c.destination);
  AU.bgm=c.createGain(); AU.bgm.connect(AU.master);
  AU.sfx=c.createGain(); AU.sfx.connect(AU.master);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=b;

function auApply(){
  if(!AU.ctx) return;
  AU.bgm.gain.value = AU.mode==="all" ? 0.16 : 0;
  AU.sfx.gain.value = AU.mode==="off" ? 0 : 0.5;
  const btn=document.getElementById("bSnd"); if(btn) btn.textContent = AU.mode==="all"?"🔊":AU.mode==="sfx"?"🔉":"🔇";
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type="square",vol=.1,dest,f2){
  const c=AU.ctx; if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

function setBgm(name){

function seqTick(){
  const c=AU.ctx; if(!c){ return; }
  if(SEQ.want && SEQ.want!==SEQ.name) setBgm(SEQ.want);
  const tr=TRACKS[SEQ.name]; if(!tr) return;
  const sd=60/tr.bpm/4;
  while(SEQ.next < c.currentTime+0.15){
    const nb=tr.lead.bars.length, bar=Math.floor(SEQ.step/16)%nb, i=SEQ.step%16, t=SEQ.next;
    const l=tr.lead.bars[bar][i]; if(l) tone(mtof(l),t,sd*tr.lead.len,tr.lead.type,tr.lead.vol*0.35,AU.bgm);
    const bb=tr.bass.bars[bar%tr.bass.bars.length][i]; if(bb) tone(mtof(bb),t,sd*tr.bass.len,tr.bass.type,tr.bass.vol*0.4,AU.bgm);
    if(tr.drum.k[i]==="x") tone(150,t,0.12,"sine",0.5,AU.bgm,40);
    if(tr.drum.s[i]==="x") noise(t,0.12,0.25,1800,"bandpass",AU.bgm);
    if(tr.drum.h[i]==="x") noise(t,0.035,0.12,7000,"highpass",AU.bgm);
    SEQ.next+=sd; SEQ.step=(SEQ.step+1)%(16*nb);
  }
}

let busy=false;
async function playScene(id){
  busy=true; const sc=SCENES[id]; S.scene=id;
  await fade(true);
  MAP=sc.setup.map; setActors(sc.setup.actors);
  if(sc.setup.world){ delete S.world.radAt; Object.assign(S.world,sc.setup.world); }
  $("loc").textContent=`${YEARS[S.year-1].title} · ${sc.loc}`; setClock(sc.time); hud(); save();
  await fade(false);
  await run(sc.intro);
  for(const [sp,tx] of (sc.pre||[])) await say(sp,tx);
  await say(null,val(sc.text));
  if(sc.quote) await say(sc.speaker,val(sc.quote));
  const pick=await choose(sc), c=sc.choices[pick.i]; CUR=pick.fx;
  msg.innerHTML=`<div class="mtext" style="color:#9aa6cc">…</div>`;
  await run(c.act);
  apply(CUR); if(c.flag) S.flags[c.flag]=true;
  const items=[c.item, sc.after].filter(x=>x && !S.items.includes(x)); items.forEach(x=>S.items.push(x));
  hud(); save();
  items.forEach((x,k)=>setTimeout(()=>toast(`📘 도감 추가: ${DEX[x].name}`),k*2300));
  const ch=chipsOf(CUR);
  await say(null,val(c.r),ch?`<div class="deltas">${ch}</div>`:"");
  busy=false;
  const b=breach(); if(b) return badEnd(b);
  let next=c.next||sc.next||NEXT[id]; next=val(next);
  if(next==="YEAR") return yearEnd();

}

  const Y=YEARS[S.year-1];
  apply(Y.routine); hud();
  await say(null,`${Y.title} 연말. 일상 업무로 쌓인 선량이 반영됐다.`,`<div class="deltas">${chipsOf(Y.routine)}</div>`);
  const b=breach(); if(b) return badEnd(b);
  S.history.push({year:S.year,eff:S.eff,lens:S.lens,skin:S.skin,ext:S.ext,crew:S.crew});
  const left=LIMIT.cum-S.cum, yrsLeft=5-S.year;
  const comment = S.eff<10?"올해 선량 관리는 모범적이었어.":S.eff<20?"무난했어. 다만 줄일 수 있었던 순간이 있었지?":S.eff<35?"올해는 많이 받았다. 5년 누적을 생각해야 해.":"이대로면 5년을 못 버텨. 다음 해엔 정말 조심해.";
  await panel(`<div class="name">📒 ${Y.title} 선량 기록부</div>`+
    recTable([["유효선량",S.eff,LIMIT.eff],["수정체",S.lens,LIMIT.lens],["피부",S.skin,LIMIT.skin],["손·발",S.ext,LIMIT.ext],["집단선량(맨·mSv)",S.crew,LIMIT.crew]])+
    `<div style="font-size:13px;margin-top:4px">5년 누적 <b class="${cls(S.cum,LIMIT.cum)}">${fmt(S.cum)}</b> / 100 mSv · 남은 여유 <b>${fmt(left)}</b> mSv${yrsLeft>0?` (남은 ${yrsLeft}년, 연평균 ${fmt(left/yrsLeft)} mSv)`:""}</div>`+
    `<div style="font-size:13px;color:#ffe27a;margin-top:6px">박 선배: "${comment}"</div>`);
  if(S.year>=5) return finalEnd();
  S.year++; S.eff=0; S.lens=0; S.skin=0; S.ext=0; S.crew=0; S.delay=0; save();
  const N=YEARS[S.year-1];
  await fade(true,N.title,N.sub); await wait(1300);
  playScene(N.first);
}

function historyTable(){
  const h=S.history; if(!h.length) return "";
  return `<table class="rec"><tr><th>연차</th><th>유효</th><th>수정체</th><th>피부</th><th>손·발</th></tr>`+
    h.map(r=>`<tr><td>${r.year}년차</td><td class="${cls(r.eff,50)}">${fmt(r.eff)}</td><td class="${cls(r.lens,150)}">${fmt(r.lens)}</td><td class="${cls(r.skin,500)}">${fmt(r.skin)}</td><td class="${cls(r.ext,500)}">${fmt(r.ext)}</td></tr>`).join("")+
    `<tr><td><b>5년 누적</b></td><td class="${cls(S.cum,100)}" colspan="4" style="text-align:left;padding-left:8px"><b>${fmt(S.cum)}</b> / 100 mSv</td></tr></table>`;
}
function showEnding(e){
  tapHandler=null; (e.tag&&e.tag.startsWith("BAD")?SFX.bad:SFX.good)();
  msg.innerHTML=`<div class="end"><span class="badge" style="background:${e.color}">${e.tag}</span>
    <h2 style="color:${e.color}">${e.title}</h2><div class="mtext">${esc(e.text)}</div>
    <div style="font-size:12px;color:#9aa6cc;margin-top:8px">📒 개인 선량 기록부 (mSv)</div>${historyTable()}
    <div style="font-size:12px;color:#9aa6cc">전문성 ${S.exp} · 신뢰도 ${S.trust} · 침착함 ${S.calm} · 도감 ${S.items.length}/${Object.keys(DEX).length}</div>
    <div class="reg"><div style="font-size:12px;color:#b9c6ef">최종 점수</div><div class="sc">${(e.score||0).toLocaleString()}점</div>
      <div style="font-size:11.5px;color:#9aa6cc">${seasonLabel()} · 닉네임으로 TOP 10에 도전하세요</div>
      <input id="nick" maxlength="10" placeholder="닉네임 (2~10자)" value="${esc(getNick())}">
      <div class="row"><button class="btn" id="regBtn">🏆 점수 등록</button><button class="btn sub" id="seeRank">순위 보기</button></div>
      <div id="regMsg" style="font-size:12px;margin-top:6px;color:#ffe27a"></div></div>
    <button class="btn" id="again">↺ 1년차부터 다시</button></div>`;
  $("again").onclick=restart;
  $("seeRank").onclick=()=>openRank();
  $("regBtn").onclick=()=>submitScore(e);
}
function badEnd(k){
  if(!S.history.find(r=>r.year===S.year)) S.history.push({year:S.year,eff:S.eff,lens:S.lens,skin:S.skin,ext:S.ext,crew:S.crew});
  const e=BADEND[k]; S.ending={tag:`BAD END · ${S.year}년차`,color:"#ff5d4f",title:e.title,text:e.text,key:"bad_"+k,score:calcScore("bad")}; save();
  S.world.alarm=false; showEnding(S.ending);
}
function finalEnd(){
  const F=S.flags;
  const legacy = F.legacyMeasure?"후배의 서베이미터에는 언제나 교정 스티커가 확인돼 있다.":F.legacyRecord?"팀의 선량 기록부는 사업소에서 가장 꼼꼼한 기록으로 꼽힌다.":"팀 채팅방에는 오늘도 질문과 답이 오간다.";
  let e;
  if(F.hidden){
    e={tag:"5년 근무 종료 · 은폐 루트",color:"#c792ea",title:"드러난 기록",text:`5년차 특별감사에서 1년차 조선소 사고의 선량 기록 누락이 다시 드러났다. 3년차 검사 때의 해명과도 맞지 않았다.\n자격 정지 처분과 함께 5년의 경력에 큰 흠이 남았다.\n작은 빈칸 하나가 5년을 따라왔다.`};
  } else {
    const score=S.exp+S.trust+S.calm - S.cum/5 - (F.overload?2:0)-(F.spread?2:0)-(F.late?3:0)-(F.public?3:0)-(F.sentJunior?3:0)-(F.transport&&!F.fixedT?2:0)-(F.guess?1:0)-(F.spreadU?2:0)-(F.sink?2:0)-(F.childExpo?3:0);
    if(score>=46 && S.cum<=35) e={tag:"5년 근무 완료 · 최고 평가",color:"#4fd18b",title:"ALARA의 기준",text:`5년 누적 ${fmt(S.cum)} mSv. 한도의 절반도 쓰지 않고 현장을 지켰다.\n사업소는 당신의 작업 계획서를 ALARA 표준 양식으로 채택했다.\n${legacy}`};
    else if(S.trust>=12) e={tag:"5년 근무 완료",color:"#6cb6ff",title:"현장이 믿는 관리자",text:`완벽하진 않았지만, 현장 사람들은 일이 꼬이면 가장 먼저 당신을 찾는다.\n김 반장은 지금도 새 현장마다 당신 이름을 적어 낸다.\n${legacy}`};
    else if(S.cum>70) e={tag:"5년 근무 완료",color:"#ff9f43",title:"아슬아슬한 5년",text:`한도는 넘지 않았다. 하지만 5년 누적 ${fmt(S.cum)} mSv. 앞으로 몇 년은 고선량 작업에 들어가기 어렵다.\n박 선배: "버틴 것도 실력이지. 다만 다음 5년은 다르게 해보자."\n${legacy}`};
    else e={tag:"5년 근무 완료",color:"#f5b400",title:"무사히 5년",text:`큰 사고 없이 5년을 채웠다. 아쉬운 판단도 있었지만 한도 안에서 배웠다.\n이제 당신은 누군가의 '박 선배'다.\n${legacy}`};
    if(F.confessed) e.text+="\n3년차에 바로잡은 기록은 이제 신입 교육 사례로 쓰인다.";
  }
  e.key=e.title; e.score=calcScore(e.title); S.ending=e; save(); showEnding(e);
}
function restart(){ const items=S.items; S=fresh(); S.items=items; save(); playScene("p1"); }

/* 도감 · 버튼 */
function toast(m){ if(m.includes("도감")) SFX.item(); const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2100); }
$("bDex").onclick=()=>{ const ks=Object.keys(DEX); $("dexSub").textContent=`수집 ${S.items.length} / ${ks.length}`;
  $("dexList").innerHTML=ks.map(k=>S.items.includes(k)?`<div class="entry"><b>${DEX[k].name}</b><p>${DEX[k].desc}</p></div>`:`<div class="entry lock"><b>??? (미발견)</b><p>게임을 진행하면 열립니다.</p></div>`).join("");
  $("dex").classList.add("open"); };
$("dexX").onclick=()=>$("dex").classList.remove("open");
$("dex").onclick=e=>{ if(e.target.id==="dex") $("dex").classList.remove("open"); };
$("bSnd").textContent = AU.mode==="all"?"🔊":AU.mode==="sfx"?"🔉":"🔇";
$("bSnd").onclick=()=>{ auInit(); AU.mode={all:"sfx",sfx:"off",off:"all"}[AU.mode]; try{ localStorage.setItem("alara_snd",AU.mode); }catch(e){} auApply(); if(AU.mode!=="off") SFX.select(); };
$("bFast").onclick=()=>{ speed=speed===1?.45:1; $("bFast").classList.toggle("on",speed!==1); };
$("bReset").onclick=()=>{ const b=$("bReset"); if(!b.dataset.arm){ b.dataset.arm=1; b.textContent="정말?"; setTimeout(()=>{ delete b.dataset.arm; b.textContent="↺"; },2500); return; }
  const items=S.items; S=fresh(); S.items=items; save(); location.reload(); };


/* =====================================================================
   8. 점수 · 시즌 점수판 (3주마다 새 시즌)
   ===================================================================== */
const SEASON_START = Date.parse("2026-11-07T15:00:00Z"); // 2026-11-08 00:00 KST, 시즌1: 11/8~11/28
const SEASON_LEN = 21*864e5;
function seasonNo(t=Date.now()){ return Math.floor((t-SEASON_START)/SEASON_LEN)+1; }
function seasonEnd(n=seasonNo()){ return new Date(SEASON_START+n*SEASON_LEN-1); }
function seasonLabel(){ const n=seasonNo(), e=seasonEnd(n); const md=e.toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric"});
  const left=Math.ceil((e-Date.now())/864e5); return `시즌 ${n} · ${md}까지 (D-${left})`; }
function calcScore(kind){
  const base={ "ALARA의 기준":500, "현장이 믿는 관리자":380, "무사히 5년":300, "아슬아슬한 5년":240, "드러난 기록":120 }[kind] ?? 40*S.year;
  const F=S.flags, pen=["overload","spread","late","public","sentJunior","guess","cover","hidden","spreadU","sink","childExpo"].filter(f=>F[f]).length*15;
  return Math.max(0, Math.round(base + S.exp*6 + S.trust*6 + S.calm*4 + Math.max(0,100-S.cum)*2 - pen));
}
function getNick(){ try{ return localStorage.getItem("eg1_nick")||""; }catch(e){ return ""; } }
function setNick(n){ try{ localStorage.setItem("eg1_nick",n); }catch(e){} }
const FB="https://energy-jobs-games-default-rtdb.firebaseio.com/scores/alara/";
const BADWORD=/시발|씨발|병신|개새|좆|fuck|shit/i;
const fkey=t=>t.replace(/[.$#\[\]\/]/g,"_");
async function submitScore(e){
  const out=$("regMsg"), nick=$("nick").value.trim().replace(/\s+/g," ");
  if(nick.length<2||nick.length>10){ out.textContent="닉네임은 2~10자로 입력해 주세요."; return; }
  if(BADWORD.test(nick)){ out.textContent="사용할 수 없는 닉네임입니다."; return; }
  setNick(nick); out.textContent="등록 중…"; $("regBtn").disabled=true;
  const sn=seasonNo(), url=FB+"S"+sn+"/"+encodeURIComponent(fkey(nick))+".json";
  try{
    const old=await fetch(url).then(r=>r.ok?r.json():null);
    if(old && typeof old.s==="number" && old.s>=e.score){
      out.textContent=`이번 시즌 내 최고 점수(${old.s}점)가 더 높아서 그 기록을 유지했어요.`;
    } else {
      const d=new Date(Date.now()+324e5).toISOString().slice(5,10).replace("-",".");
      const r=await fetch(url,{method:"PUT",body:JSON.stringify({n:nick,s:e.score,d,e:e.title,c:Math.round(S.cum*10)/10,t:Date.now()})});
      if(!r.ok) throw 0;
      out.textContent="등록 완료! 오른쪽 랭킹에서 확인해 보세요.";
    }
    try{ parent.postMessage({type:"alara-score",nick},location.origin); }catch(err){}
    openRank(nick);
  }catch(err){ out.textContent="등록하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."; $("regBtn").disabled=false; }
}
async function openRank(me){
  $("rank").classList.add("open"); $("rankSub").textContent=seasonLabel()+" · 3주마다 초기화 · 모든 방문자 공용";
  const list=$("rankList"); list.innerHTML=`<div class="entry"><p>불러오는 중…</p></div>`;
  try{
    const d=await fetch(FB+"S"+seasonNo()+".json").then(r=>{ if(!r.ok) throw 0; return r.json(); });
    const docs=Object.values(d||{}).filter(x=>x&&typeof x.s==="number").sort((a,b)=>b.s-a.s||(a.t||0)-(b.t||0));
    if(!docs.length){ list.innerHTML=`<div class="entry"><p>이번 시즌 첫 기록의 주인공이 되어 보세요!</p></div>`; return; }
    if(typeof me!=="string") me=getNick();
    list.innerHTML=docs.slice(0,10).map((x,i)=>`<div class="rk ${x.n===me?"me":""}"><div class="no">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>
      <div class="nm"><b>${esc(x.n||"익명")}</b><small>${esc(x.e||"")} · 5년 누적 ${x.c??"-"} mSv</small></div><div class="pt">${(x.s||0).toLocaleString()}</div></div>`).join("");
  }catch(err){ list.innerHTML=`<div class="entry"><p>랭킹을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p></div>`; }
}
$("bRank").onclick=()=>openRank();
$("rankX").onclick=()=>$("rank").classList.remove("open");
$("rank").onclick=e=>{ if(e.target.id==="rank") $("rank").classList.remove("open"); };

/* 시작 */
if(S.ending){ const sc=SCENES[S.scene]; MAP=sc.setup.map; setActors(sc.setup.actors); $("loc").textContent=YEARS[S.year-1].title; hud(); showEnding(S.ending); }
else { hud(); (async()=>{ if(S.scene===YEARS[S.year-1].first){ const Y=YEARS[S.year-1]; await fade(true,Y.title,Y.sub); await wait(1200); } playScene(S.scene); })(); }


</script>
</body>
