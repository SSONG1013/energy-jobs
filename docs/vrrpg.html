<script>
'use strict';
/* =========================================================
   현생에 무면허자였던 나, VR 게임으로 방사선안전관리자가 된다?  v0.1
   제작자: ssong

const VERSION='0.2';
const W=480,H=270,TILE=16;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let SCALE=2;
function resize(){
  const vw=innerWidth,vh=innerHeight-14;
  SCALE=Math.max(1,Math.min(vw/W,vh/H));
  cv.width=Math.floor(W*SCALE*devicePixelRatio);cv.height=Math.floor(H*SCALE*devicePixelRatio);
  cv.style.width=Math.floor(W*SCALE)+'px';cv.style.height=Math.floor(H*SCALE)+'px';
  const r=document.getElementById('rotate');
  if(isTouch)r.classList.add('need');
}
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
addEventListener('resize',resize);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();Game.mouse={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
cv.addEventListener('mouseleave',()=>Game.mouse=null);

/* ---------------- utils ---------------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(n).toLocaleString('ko-KR');

/* ---------------- storage (v0.1: 이 기기 브라우저) ---------------- */
const Store={
  mem:{},
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return this.mem[k]||null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){this.mem[k]=v;}}
};
const ACC_KEY='vrrso_accounts_v1';
function accounts(){return Store.get(ACC_KEY)||{};}
function saveAccounts(a){Store.set(ACC_KEY,a);}
function hashPw(id,pw){
  // 간단 해시 (브라우저 보안 기능 없이도 동작)
  const str='vrrso::'+id+'::'+pw;let h1=0x811c9dc5,h2=0x1234567;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2+c,2654435761)^(h2>>>13);}
  return (h1>>>0).toString(16)+(h2>>>0).toString(16);
}

/* ---------------- 온라인 (Firebase 인증 + Firestore) ---------------- */
const FB={projectId:'ssongproject1',apiKey:'AIzaSyDG37TZIbNhpFdZQJ8Om5RaO0Lzt3qU55Q'}; // 공유사이트와 같은 웹 앱 공개 키
const Online={
  on:false,uid:null,tok:null,ref:null,exp:0,last:0,timer:null,status:'',
  email(key){return 'u'+hashPw(key,'#id#')+hashPw('#id#',key)+'@vrrpg.game';},
  fpw(key,pw){return 'vrrpg::'+pw+'::'+key;},
  base(){return `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;},
  async req(url,opt,ms){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||9000);try{return await fetch(url,{...opt,signal:ctl.signal});}finally{clearTimeout(t);}},
  async auth(path,body){const r=await this.req(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,returnSecureToken:true})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP'+r.status));return j;},
  setTok(j){this.uid=j.localId||j.user_id;this.tok=j.idToken||j.id_token;this.ref=j.refreshToken||j.refresh_token;this.exp=Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000;},
  async token(){if(Date.now()<this.exp)return this.tok;
    const r=await this.req(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(this.ref)});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('REFRESH');this.setTok(j);return this.tok;},
  async login(key,pw){const email=this.email(key),password=this.fpw(key,pw);
    try{this.setTok(await this.auth('signUp',{email,password}));return 'new';}catch(e){if(!/EMAIL_EXISTS/.test(e.message))throw e;}
    try{this.setTok(await this.auth('signInWithPassword',{email,password}));return 'old';}
    catch(e){if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(e.message))throw new Error('BADPW');throw e;}},
  async getUser(){const r=await this.req(`${this.base()}/vrrpg_users/${this.uid}`,{headers:{Authorization:'Bearer '+await this.token()}});
    if(r.status===404)return null;if(!r.ok)throw new Error('GET'+r.status);const j=await r.json();return JSON.parse(j.fields.data.stringValue);},
  async putUser(a){const body={fields:{id:{stringValue:String(a.id)},data:{stringValue:JSON.stringify(a)},at:{integerValue:String(Date.now())}}};
    const r=await this.req(`${this.base()}/vrrpg_users/${this.uid}`,{method:'PATCH',headers:{Authorization:'Bearer '+await this.token(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('PUT'+r.status);},
  async putRank(row,season){const I=v=>({integerValue:String(Math.floor(v||0))}),S=v=>({stringValue:String(v||'')});
    const f={uid:S(this.uid),season:I(season),name:S(row.name),lv:I(row.lv),exp:I(row.exp),job:S(row.job),certs:I(row.certs),at:I(row.at||Date.now())};
    const r=await this.req(`${this.base()}/vrrpg_rank/${season}_${this.uid}`,{method:'PATCH',headers:{Authorization:'Bearer '+await this.token(),'Content-Type':'application/json'},body:JSON.stringify({fields:f})});if(!r.ok)throw new Error('RANK'+r.status);},
  async rank(season){
    const r=await this.req(`${this.base()}:runQuery?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:'vrrpg_rank'}],where:{fieldFilter:{field:{fieldPath:'season'},op:'EQUAL',value:{integerValue:String(season)}}},limit:500}})},7000);
    const a=await r.json();if(!r.ok||!Array.isArray(a))throw new Error('Q');
    return a.filter(x=>x.document).map(x=>{const f=x.document.fields;const g=k=>f[k]?(f[k].integerValue!=null?+f[k].integerValue:f[k].stringValue):null;
      return{name:g('name'),lv:g('lv'),exp:g('exp'),job:g('job')||null,certs:g('certs'),at:g('at'),acc:g('uid')};}).sort((x,y)=>y.lv-x.lv||y.exp-x.exp||x.at-y.at);},
  bestRow(a,season){let best=null;for(const c of a.chars||[]){if(!c||!c.seasonLog)continue;const s=c.seasonLog[season];if(!s)continue;if(!best||s.lv>best.lv||(s.lv===best.lv&&s.exp>best.exp))best={...s,name:c.name};}return best;},
  async push(){
    if(!this.on||!Game.account)return;this.last=Date.now();clearTimeout(this.timer);this.timer=null;
    const a=accounts()[Game.account];if(!a)return;
    try{await this.putUser(a);const s=seasonNow(),row=this.bestRow(a,s);if(row)await this.putRank(row,s);this.status='ok';}
    catch(e){this.status='err';}
  },
  schedule(now){if(!this.on)return;if(now||Date.now()-this.last>15000)return this.push();if(!this.timer)this.timer=setTimeout(()=>this.push(),15000-(Date.now()-this.last));},
  logout(){if(this.on)this.push();this.on=false;this.uid=this.tok=this.ref=null;this.exp=0;}
};

// 3주 시즌: 2026-11-09(월) 00:00 KST 기준
const SEASON_EPOCH=Date.UTC(2026,10,8,15,0,0);
const SEASON_LEN=21*24*3600*1000;
function seasonNow(){return Math.max(0,Math.floor((Date.now()-SEASON_EPOCH)/SEASON_LEN));}
function seasonRange(s){const a=new Date(SEASON_EPOCH+s*SEASON_LEN),b=new Date(SEASON_EPOCH+(s+1)*SEASON_LEN-1);const f=d=>(d.getMonth()+1)+'/'+d.getDate();return f(a)+' ~ '+f(b);}

/* ---------------- audio ---------------- */
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10],DOR=[0,2,3,5,7,9,10],PHR=[0,1,3,5,7,8,10],LYD=[0,2,4,6,7,9,11];
const _=null;
const TRACKS={
 lobby:{bpm:88,root:261.63,scale:MAJ,prog:[0,5,3,4],lead:[0,_,2,_,4,_,2,_,7,_,4,_,2,_,4,_],lw:'triangle',lv:.03,bass:'x.......x...x...',kick:'x.......x.......',snare:'................',hat:'..x...x...x...x.',pad:1},
 bright:{bpm:116,root:293.66,scale:MAJ,prog:[0,4,5,3],lead:[0,2,4,2,7,4,2,4,0,2,4,7,9,7,4,2],lw:'square',lv:.016,bass:'x...x.x.x...x.x.',kick:'x...x...x...x...',snare:'....x.......x...',hat:'x.x.x.x.x.x.x.x.',pad:1},
 industrial:{bpm:126,root:220,scale:MIN,prog:[0,5,6,4],lead:[0,_,0,3,_,4,_,2,0,_,0,7,_,6,4,_],lw:'square',lv:.016,bass:'x.xx..x.x.xx..x.',kick:'x..x..x.x..x..x.',snare:'....x.......x..x',hat:'xxxxxxxxxxxxxxxx',pad:0},
 under:{bpm:96,root:196,scale:MIN,prog:[0,0,5,4],lead:[0,_,_,2,_,_,1,_,0,_,_,4,_,3,_,_],lw:'triangle',lv:.03,bass:'x.......x..x....',kick:'x.......x..x....',snare:'........x.......',hat:'..x...x...x...x.',pad:1},
 plant:{bpm:132,root:246.94,scale:DOR,prog:[0,3,6,4],lead:[0,2,3,4,_,4,3,2,0,_,4,_,7,6,4,_],lw:'square',lv:.015,bass:'x.x.x.x.x.x.x.x.',kick:'x...x...x...x.x.',snare:'....x.......x...',hat:'x.xxx.xxx.xxx.xx',pad:0},
 cosmos:{bpm:112,root:277.18,scale:LYD,prog:[0,1,0,4],lead:[0,2,4,6,7,6,4,2,0,2,4,9,7,4,2,_],lw:'triangle',lv:.03,bass:'x.....x...x.....',kick:'x.......x.......',snare:'....x.......x...',hat:'..x.x...x.x...x.',pad:1},
 core:{bpm:140,root:207.65,scale:PHR,prog:[0,1,0,6],lead:[0,1,0,_,3,_,1,0,7,_,6,_,1,_,0,_],lw:'sawtooth',lv:.012,bass:'x..x..x...x..x..',kick:'x..x..x...x..x..',snare:'....x.......x...',hat:'xxxxxxxxxxxxxxxx',pad:0},
 boss:{bpm:152,root:220,scale:MIN,prog:[0,5,6,4],lead:[0,3,4,7,6,4,3,4,0,3,4,9,7,6,4,3],lw:'sawtooth',lv:.013,bass:'xxx.xxx.xxx.xx.x',kick:'x.x.x.x.x.x.x.x.',snare:'....x.......x.x.',hat:'xxxxxxxxxxxxxxxx',pad:0}
};
const MUSIC_OF=['bright','bright','bright','bright','industrial','industrial','industrial','industrial','under','under','under','under','plant','plant','plant','plant','plant','cosmos','cosmos','core'];
const Sound={
  ac:null,on:true,bgmOn:true,master:null,sfx:null,music:null,track:null,stp:0,next:0,boss:false,zone:-2,nbuf:null,
  init(){if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ac=new AC();
      const comp=this.ac.createDynamicsCompressor();comp.connect(this.ac.destination);
      this.master=this.ac.createGain();this.master.gain.value=.9;this.master.connect(comp);
      this.sfx=this.ac.createGain();this.sfx.gain.value=.85;this.sfx.connect(this.master);
      this.music=this.ac.createGain();this.music.gain.value=.55;this.music.connect(this.master);
      setInterval(()=>this.sched(),25);this.pick();}catch(e){this.ac=null;}},
  now(){return this.ac?this.ac.currentTime:0;},
  ok(){return this.on&&this.ac;},
  env(dest,t,a,d,vol){const g=this.ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(dest);return g;},
  osc(type,f,t,dur,vol,dest,slide,a=.005){const o=this.ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);o.connect(this.env(dest,t,a,dur,vol));o.start(t);o.stop(t+a+dur+.05);},
  nz(t,dur,vol,dest,type,freq,q,to){if(!this.nbuf){const n=this.ac.sampleRate;this.nbuf=this.ac.createBuffer(1,n,n);const c=this.nbuf.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;}
    const s=this.ac.createBufferSource();s.buffer=this.nbuf;const f=this.ac.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq||2000,t);if(to)f.frequency.exponentialRampToValueAtTime(to,t+dur);f.Q.value=q||1;
    s.connect(f);f.connect(this.env(dest,t,.003,dur,vol));s.start(t,Math.random()*.5);s.stop(t+dur+.05);},
  // ---- 효과음 ----
  tone(f,d,type='square',vol=.05,slide=0){if(this.ok())this.osc(type,f,this.now(),d,vol,this.sfx,slide);},
  noise(d,vol=.05){if(this.ok())this.nz(this.now(),d,vol,this.sfx,'lowpass',3000);},
  hit(){if(!this.ok())return;const t=this.now();this.osc('square',260,t,.06,.045,this.sfx,.45);this.nz(t,.05,.07,this.sfx,'bandpass',2500,1.5);},

    if(!this.ac||!this.track)return;
    if(!this.bgmOn||!this.on||(Game.paused&&Game.scene==='play')){this.next=this.now()+.05;return;}
    const spb=60/this.track.bpm/4;
    if(this.next<this.now()-.2)this.next=this.now()+.02;

  play(s,t,spb){
    const tr=this.track,st=s%16,ch=tr.prog[Math.floor(s/16)%tr.prog.length],sc=tr.scale,m=this.music;

    if(tr.snare[st]==='x')this.nz(t,.14,.07,m,'bandpass',1800,.8);
    if(tr.hat[st]==='x')this.nz(t,.03,.025,m,'highpass',7000);
  }

/* ---------------- 공식 ---------------- */
const expNext=L=>Math.floor(30*Math.pow(L,1.8));
const pAtkEff=L=>10+2*(L-1)+6*Math.floor(L/6);
const pDefEff=L=>5+1.2*(L-1)+4*Math.floor(L/6);
const pHPof=L=>100+12*(L-1);
function mobStats(L,beh,boss){
  const mdef=3+L;
  let hp=5*pAtkEff(L)*(50+mdef)/50;
  let atk=(pHPof(L)/11)*(50+pDefEff(L))/50; // 같은 레벨 몬스터에게 약 11~12대 버팀
  let spd=40;
  if(beh==='tank'){hp*=2.4;spd=24;}
  if(beh==='swarm'){hp*=.45;atk*=.55;spd=58;}
  if(beh==='dash'){hp*=.85;spd=46;}
  if(beh==='shoot'){hp*=.8;spd=30;}
  if(beh==='ghost'){hp*=.9;spd=34;}
  if(beh==='turret'){hp*=1.3;spd=0;}
  if(beh==='mimic'){hp*=1.2;spd=70;}
  if(beh==='split'){hp*=1.1;spd=32;}
  if(beh==='mole'){hp*=.9;spd=36;}
  if(boss){hp=56*pAtkEff(L)*(50+mdef)/50;atk*=1.2;spd=36;}
  return{hp:Math.round(hp),atk,def:mdef,spd,exp:Math.max(4,Math.round(expNext(L)/(boss?.8:16))),gold:boss?40+L*12:2+Math.round(L*.8)};
}

function stats(c){
  const L=c.lv;
  let s={hp:100+12*(L-1),mp:30+3*(L-1),atk:10+2*(L-1),def:5+1.2*(L-1),spd:62,crit:.10,contam:1,skill:1,cd:1,regen:0,mpregen:.6,exp:1,far:0};
  s.atk+=c.weapon*6;s.def+=c.armor*4;s.hp+=c.armor*20;
  const sh=SHIELDS[c.shieldT];if(sh.spd)s.spd*=1+sh.spd;
  for(const id of c.certs){const b=CERTS.find(x=>x.id===id).bonus;
    if(b.def)s.def+=b.def;if(b.hp)s.hp+=b.hp;if(b.mp)s.mp+=b.mp;if(b.atk)s.atk+=b.atk;
    if(b.contam)s.contam*=1-b.contam;if(b.regen)s.regen+=b.regen;if(b.mpregen)s.mpregen+=b.mpregen;
    if(b.skill)s.skill+=b.skill;if(b.cd)s.cd*=1-b.cd;if(b.spd)s.spd*=1+b.spd;if(b.exp)s.exp+=b.exp;}
  const ppeN=PPE.filter(p=>c.look.ppe[p[0]]).length;s.contam*=1-.01*ppeN;
  if(c.job==='res')s.mp*=1.3;
  if(c.job==='ndt')s.far=.2;
  if(c.job==='grad'){s.crit+=.15;s.hp*=.9;}
  if(c.job==='open'){s.def*=1.25;s.contam*=.6;}
  if(c.job==='gen')s.atk*=1.1;
  if(c.certs.includes('toeic')){s.hp*=1.1;s.mp*=1.1;s.atk*=1.1;s.def*=1.1;s.spd*=1.1;}
  s.hp=Math.round(s.hp);s.mp=Math.round(s.mp);
  return s;
}

const keys={};const pressed={};
function keyName(e){
  const c=e.code||'';
  if(c.startsWith('Key'))return c.slice(3).toLowerCase();
  if(c.startsWith('Digit'))return c.slice(5);
  if(c.startsWith('Control'))return 'ctrl';if(c.startsWith('Alt'))return 'alt';if(c.startsWith('Shift'))return 'shift';
  if(c==='Space')return ' ';if(c==='Tab')return 'tab';if(c==='Escape')return 'escape';
  if(c.startsWith('Arrow'))return c.toLowerCase();
  return (e.key||'').toLowerCase();
}
addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const k=keyName(e);if(!keys[k])pressed[k]=true;keys[k]=true;
  // 브라우저 단축키(Ctrl+R 새로고침, Alt 메뉴 등) 막기 — Ctrl+W(탭 닫기)는 브라우저가 막지 못할 수 있음
  if(Game.scene==='play'&&(e.ctrlKey||e.altKey||['tab',' ','alt','ctrl','shift','arrowup','arrowdown','arrowleft','arrowright'].includes(k)))e.preventDefault();
  Sound.init();
});
addEventListener('keyup',e=>{const k=keyName(e);keys[k]=false;if(Game.scene==='play'&&(k==='alt'||k==='ctrl'))e.preventDefault();});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Game.scene==='play'){saveChar();Online.push();}});
addEventListener('beforeunload',e=>{if(Game.scene==='play'){saveChar();Online.push();e.preventDefault();e.returnValue='';}});
const touch={dx:0,dy:0,atk:false,act:{}};
function setupTouch(){
  if(!isTouch)return;document.getElementById('touch').classList.add('on');
  const st=document.getElementById('stick'),kn=document.getElementById('knob');let sid=null;
  const move=e=>{const r=st.getBoundingClientRect();let x=e.clientX-r.left-60,y=e.clientY-r.top-60;const m=Math.hypot(x,y);if(m>44){x*=44/m;y*=44/m;}kn.style.left=(38+x)+'px';kn.style.top=(38+y)+'px';touch.dx=x/44;touch.dy=y/44;};
  st.addEventListener('pointerdown',e=>{sid=e.pointerId;st.setPointerCapture(sid);move(e);Sound.init();});
  st.addEventListener('pointermove',e=>{if(e.pointerId===sid)move(e);});
  const end=e=>{if(e.pointerId===sid){sid=null;touch.dx=touch.dy=0;kn.style.left='38px';kn.style.top='38px';}};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  const bind=(id,fn,hold)=>{const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();Sound.init();if(hold)touch.atk=true;else fn();});
    if(hold){el.addEventListener('pointerup',()=>touch.atk=false);el.addEventListener('pointercancel',()=>touch.atk=false);el.addEventListener('pointerleave',()=>touch.atk=false);}};
  bind('tAtk',null,true);
  bind('tDash',()=>pressed[' ']=true);
  bind('tS1',()=>pressed['q']=true);bind('tS2',()=>pressed['w']=true);bind('tS3',()=>pressed['e']=true);bind('tS4',()=>pressed['r']=true);
  bind('tSwap',()=>pressed['tab']=true);bind('tSp',()=>pressed['alt']=true);
  bind('tPot',()=>pressed['shift']=true);bind('tUse',()=>pressed['z']=true);bind('tMenu',()=>pressed['escape']=true);
}

  <p class="small">⚠ 비밀번호를 잊으면 찾을 수 없습니다. 재설정은 관리자(okmyway4@naver.com)에게 문의하세요.<br>계정과 캐릭터는 온라인에 저장되어 PC·휴대폰 어디서든 같은 아이디로 이어 할 수 있어요.</p>
  <p class="small">조작 — 이동: 방향키 · 기본공격: Ctrl · 스킬: Q·W·E·R · 스킬 탭 전환(공통↔직업): Tab · 직업 특수 스킬: Alt · 대시: Space · 대화/조사: Z · HP 포션: Shift (MP 포션 1, 제염키트 2) · 메뉴: Esc</p>`,b=>{

          acc[key]=remote;}
        else if(acc[key]&&acc[key].pw===h){} // 이 기기의 기존 기록을 온라인으로 올림
        else acc[key]={id,pw:h,chars:[],created:Date.now()};
        saveAccounts(acc);Game.account=key;await Online.push();
        toast(res==='new'?'새 계정을 만들었습니다. (온라인 저장)':'로그인했습니다. (온라인 저장)','#9fe3ff');
        return showCharSelect();
      }catch(e){
        Online.on=false;
        if(e.message==='BADPW')return showLogin('비밀번호가 맞지 않습니다.',id);
        // 온라인 연결이 안 되면 이 기기 저장으로 계속
        if(!acc[key]){acc[key]={id,pw:h,chars:[],created:Date.now()};saveAccounts(acc);}
        else if(acc[key].pw!==h)return showLogin('비밀번호가 맞지 않습니다.',id);

/* ===== 점수판 ===== */
function leaderboard(season){
  const a=accounts();const rows=[];
  for(const k in a){let best=null;for(const c of a[k].chars||[]){if(!c||!c.seasonLog)continue;const s=c.seasonLog[season];if(!s)continue;
    if(!best||s.lv>best.lv||(s.lv===best.lv&&s.exp>best.exp)||(s.lv===best.lv&&s.exp===best.exp&&s.at<best.at))best={...s,name:c.name,acc:k};}
    if(best)rows.push(best);}
  rows.sort((x,y)=>y.lv-x.lv||y.exp-x.exp||x.at-y.at);return rows;
}
function showLeaderboard(back){
  const s=seasonNow();
  openPanel(`<h2>점수판 — 시즌 ${s+1}</h2><p class="small">불러오는 중…</p>`);
  (async()=>{
    let rows,prev,online=true;
    try{rows=await Online.rank(s);prev=s>0?(await Online.rank(s-1)).slice(0,3):[];}
    catch(e){online=false;rows=leaderboard(s);prev=s>0?leaderboard(s-1).slice(0,3):[];}
    const me=r=>online?(Online.uid&&r.acc===Online.uid):(Game.account===r.acc);
    let h=`<h2>점수판 — 시즌 ${s+1}</h2><p class="small">${seasonRange(s)} · 3주마다 순위표만 초기화 · 레벨 높은 순 (같으면 경험치 순)</p>
    <table><tr><th>순위</th><th>캐릭터</th><th>레벨</th><th>직업</th><th>자격증</th></tr>`;
    rows.slice(0,10).forEach((r,i)=>{h+=`<tr${me(r)?' style="color:#9fe3ff"':''}><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.lv}</td><td>${r.job?JOBS[r.job].short:'견습'}</td><td>${r.certs||0}</td></tr>`;});
    if(!rows.length)h+=`<tr><td colspan="5" class="small">이번 시즌 기록이 아직 없습니다.</td></tr>`;
    h+='</table>';
    const mine=rows.findIndex(me);if(mine>=10)h+=`<p class="small">내 순위: ${mine+1}위</p>`;
    if(prev.length){h+=`<h3>명예의 전당 — 시즌 ${s}</h3>`+prev.map((r,i)=>`<p>${['🥇','🥈','🥉'][i]} ${esc(r.name)} · Lv.${r.lv}</p>`).join('');}

    if(!panel.classList.contains('show'))return;
    openPanel(h,()=>{$('#bBack').onclick=()=>back?back():closePanel();});
  })();
}

function recalc(full){
  const old=P.st;P.st=stats(Game.char);
  if(old&&!full){P.hp=Math.min(P.hp+(P.st.hp-old.hp>0?P.st.hp-old.hp:0),P.st.hp);P.mp=Math.min(P.mp,P.st.mp);}
}

function enterZone(z){
  const Z=ZONES[z];const w=44,h=26,g=makeGrid(w,h);const r=seeded(1000+z*77);
  for(let x=0;x<w;x++){g[0][x]=1;g[h-1][x]=1;}for(let y=0;y<h;y++){g[y][0]=1;g[y][w-1]=1;}
  for(let i=0;i<26;i++){const bx=2+Math.floor(r()*(w-6)),by=2+Math.floor(r()*(h-6));const bw=1+Math.floor(r()*3),bh=1+Math.floor(r()*2);
    if(Math.abs(bx-4)<5&&Math.abs(by-h/2)<4)continue;
    for(let yy=by;yy<by+bh;yy++)for(let xx=bx;xx<bx+bw;xx++)if(yy<h-1&&xx<w-1)g[yy][xx]=1;}
  world={type:'zone',theme:THEMES[z],z,Z,w,h,g,fl:Z.fl,wl:Z.wl,ac:Z.ac,dark:Z.dark,mobs:[],shots:[],eshots:[],parts:[],nums:[],tele:[],puddles:[],objs:[],fx:[],drones:[],vort:[],spawnT:0,kills:0,boss:null,bossNeed:Game.char.cleared[z]?20:15,bossDone:false};
  for(let i=0;i<5;i++){const p=freeSpot(r);world.puddles.push({x:p.x,y:p.y,r:12+r()*6,life:1e9,perm:1});}
  // exit portal
  world.objs.push({x:3*TILE,y:Math.floor(h/2)*TILE,name:'로비 귀환',col:'#22d3ee',act:'exit',npc:1,sub:''});
  // hidden cert objects
  placeCertObjects(z,r);
  if(!(Game.char.notes||{})['p:'+z]){const p=freeSpot(r);world.objs.push({x:p.x,y:p.y,name:'지식 노트 조각',col:'#93c5fd',act:'note',hidden:1});}
  if(!Game.char.tut1){Game.char.tut1=true;Game.introQ.push({tut:1});}
  P.x=4*TILE+8;P.y=Math.floor(h/2)*TILE+8;P.contam=Math.max(0,P.contam);Game.zone=z;
  Sound.bgm(z);Sound.portal();Game.fade=1;
  Game.banner={t:`구역 ${z+1}. ${Z.n}`,s:`권장 Lv ${Z.lo}~${Z.hi}`,life:2.5};
  for(let i=0;i<5;i++)spawnMob();

function freeSpot(r){r=r||Math.random;for(let k=0;k<200;k++){const tx=2+Math.floor(r()*(world.w-4)),ty=2+Math.floor(r()*(world.h-4));if(!world.g[ty][tx]&&!world.g[ty][tx+1]&&!world.g[ty+1]?.[tx])return{x:tx*TILE+8,y:ty*TILE+8};}return{x:world.w*TILE/2,y:world.h*TILE/2};}
function placeCertObjects(z,r){
  const c=Game.char;
  for(const ct of CERTS){
    if(ct.zone!==z+1||c.certs.includes(ct.id)||c.lv<ct.lv)continue;
    if(ct.id==='toeic'){if(CERTS.filter(x=>!x.legend).every(x=>c.certs.includes(x.id))){const p=freeSpot(r);world.objs.push({x:p.x,y:p.y,name:'외국인 연구원',col:'#ffd700',act:'exam',cert:ct.id,npc:1,sub:'???'});}continue;}
    const prog=c.certProg[ct.id]||[];
    for(let i=0;i<ct.count;i++){const p=freeSpot(r);if(prog.includes(i))continue;world.objs.push({x:p.x,y:p.y,name:ct.obj,col:'#fff59d',act:'certobj',cert:ct.id,idx:i,hidden:1});}
    if(prog.length>=ct.count){const p=freeSpot(r);world.objs.push({x:p.x,y:p.y,name:'시험관',col:'#fde047',act:'exam',cert:ct.id,npc:1,sub:ct.name});}
  }
}
function solid(px,py){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);if(tx<0||ty<0||tx>=world.w||ty>=world.h)return true;return world.g[ty][tx]===1;}
function moveBody(o,dx,dy,r){
  const nx=o.x+dx;if(!solid(nx-r,o.y-r)&&!solid(nx+r,o.y-r)&&!solid(nx-r,o.y+r)&&!solid(nx+r,o.y+r))o.x=nx;
  const ny=o.y+dy;if(!solid(o.x-r,ny-r)&&!solid(o.x+r,ny-r)&&!solid(o.x-r,ny+r)&&!solid(o.x+r,ny+r))o.y=ny;
}

/* ---------------- 몬스터 ---------------- */
function spawnMob(boss){
  const Z=world.Z,z=world.z;
  let p,tries=0;do{p=freeSpot();tries++;}while(Math.hypot(p.x-P.x,p.y-P.y)<130&&tries<40);
  if(boss){p={x:(world.w-8)*TILE,y:world.h/2*TILE};for(let i=0;i<30&&solid(p.x,p.y);i++)p.x-=TILE;}
  const def=boss?[Z.boss[0],Z.boss[1],Z.boss[2],'boss',Z.ac]:pick(Z.mobs);
  const L=boss?Z.hi:irand(Z.lo,Z.hi);const s=mobStats(L,def[3],boss);
  const m={x:p.x,y:p.y,name:def[0],shape:def[1],rad:def[2],beh:def[3],col:def[4],L,hp:s.hp,max:s.hp,atk:s.atk,def:s.def,spd:s.spd,exp:s.exp,gold:s.gold,
    r:boss?14:7,boss:!!boss,t:rand(0,2),st:'idle',stT:0,flash:0,vuln:0,critMark:0,kb:{x:0,y:0},pats:boss?Z.boss[3]:null,patT:2,phase:1,sz:boss?2.2:1};
  if(def[3]==='swarm'){m.r=5;m.sz=.75;}
  if(def[3]==='mimic')m.st='sleep';
  if(def[3]==='turret')m.on=true;
  world.mobs.push(m);
  if(boss){world.boss=m;Game.banner={t:`⚠ 보스 출현: ${m.name}`,s:`Lv.${L} · ${RADN[m.rad]} 속성`,life:3};Game.shake=8;Sound.boom();Sound.roar();Sound.setBoss(true);}
  return m;
}
function mobAI(m,dt){
  const d=Math.hypot(P.x-m.x,P.y-m.y),ax=(P.x-m.x)/(d||1),ay=(P.y-m.y)/(d||1);
  m.t+=dt;m.stT-=dt;if(m.flash>0)m.flash-=dt;if(m.vuln>0)m.vuln-=dt;if(m.critMark>0)m.critMark-=dt;
  if(m.kb.x||m.kb.y){moveBody(m,m.kb.x*dt,m.kb.y*dt,m.r*.7);m.kb.x*=.85;m.kb.y*=.85;if(Math.abs(m.kb.x)+Math.abs(m.kb.y)<5)m.kb.x=m.kb.y=0;}
  if(m.stun>0){m.stun-=dt;return;}
  const sp=m.spd*(world.z>=0?1:1);
  const go=(mul=1)=>{const ghost=m.beh==='ghost';if(ghost){m.x+=ax*sp*mul*dt;m.y+=ay*sp*mul*dt;}else moveBody(m,ax*sp*mul*dt,ay*sp*mul*dt,m.r*.7);};
  if(m.boss)return bossAI(m,dt,d,ax,ay);
  switch(m.beh){
    case 'chase':case 'tank':case 'split':case 'ghost':case 'swarm':if(d<260)go();break;
    case 'dash':
      if(m.st==='idle'){if(d<220)go(.6);if(d<120&&m.stT<=0){m.st='wind';m.stT=.5;m.dx=ax;m.dy=ay;}}
      else if(m.st==='wind'){if(m.stT<=0){m.st='go';m.stT=.35;}}
      else if(m.st==='go'){moveBody(m,m.dx*sp*4.2*dt,m.dy*sp*4.2*dt,m.r*.7);if(m.stT<=0){m.st='idle';m.stT=1.2;}}
      break;
    case 'shoot':
      if(d>110)go(.8);else if(d<70)go(-.6);
      if(m.stT<=0&&d<230){m.stT=rand(1.6,2.4);eShot(m,ax,ay,110,.8);}
      break;
    case 'turret':
      m.on=(Math.floor(m.t/2.2)%2)===0;
      if(m.on&&m.stT<=0&&d<220){m.stT=1.1;eShot(m,ax,ay,120,.75);}
      break;
    case 'mimic':
      if(m.st==='sleep'){if(d<50){m.st='awake';m.stT=.3;Game.shake=3;}}
      else go(1);
      break;
    case 'mole':
      if(m.stT<=0&&d<260){m.stT=3;m.hide=.6;}
      if(m.hide>0){m.hide-=dt;if(m.hide<=0){const a=rand(0,6.28);const nx=P.x+Math.cos(a)*30,ny=P.y+Math.sin(a)*30;if(!solid(nx,ny)){m.x=nx;m.y=ny;}spark(m.x,m.y,m.col,8);}}
      else if(d<200)go(.7);
      break;
  }
  // contact damage
  if(d<m.r+6&&!(m.beh==='mimic'&&m.st==='sleep')&&!(m.hide>0))hurtPlayer(m.atk*(m.beh==='dash'&&m.st==='go'?1.2:1),m.rad,m);
  // ghost aura
  if(m.rad==='alpha'&&d<22)addContam(6*dt);
}
function bossAI(m,dt,d,ax,ay){
  const fast=m.hp<m.max*.5?1.35:1;if(fast>1&&m.phase===1){m.phase=2;toast(`${m.name}이(가) 격노했다!`,'#ff8a8a');Game.shake=6;}
  if(m.st==='charge'){moveBody(m,m.dx*260*dt,m.dy*260*dt,m.r*.6);if(m.stT<=0)m.st='idle';}
  else if(m.st==='idle'){if(d>40)moveBody(m,ax*m.spd*fast*dt,ay*m.spd*fast*dt,m.r*.6);}
  if(m.blinkT>0){m.blinkT-=dt;}
  m.patT-=dt*fast;
  if(m.patT<=0&&m.st==='idle'){
    const p=pick(m.pats);m.patT=rand(1.8,2.6);const tel=.7/fast;
    if(p==='charge'){m.dx=ax;m.dy=ay;world.tele.push({type:'line',x:m.x,y:m.y,dx:ax,dy:ay,len:200,w:22,t:tel,max:tel,cb:()=>{m.st='charge';m.stT=.75;}});}
    if(p==='ring'){const R=70;world.tele.push({type:'circle',x:m.x,y:m.y,r:R,t:tel,max:tel,follow:m,cb:()=>{ring(m.x,m.y,R,m.col);if(Math.hypot(P.x-m.x,P.y-m.y)<R)hurtPlayer(m.atk*1.3,m.rad,m);}});}
    if(p==='spray'){const n=m.phase>1?11:7;const base=Math.atan2(ay,ax);for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.22;setTimeout(()=>{if(m.hp>0)eShot(m,Math.cos(a),Math.sin(a),120,.7);},i*40);}}
    if(p==='beam'){const a=Math.atan2(ay,ax);const dx=Math.cos(a),dy=Math.sin(a);world.tele.push({type:'line',x:m.x,y:m.y,dx,dy,len:320,w:16,t:tel+.2,max:tel+.2,cb:()=>{beamFx(m.x,m.y,dx,dy,320,m.col,10);if(pointLineDist(P,m.x,m.y,dx,dy,320)<14)hurtPlayer(m.atk*1.6,m.rad,m);}});}
    if(p==='summon'){const nn=world.mobs.filter(x=>!x.boss).length;if(nn<9)for(let i=0;i<3;i++){const s=spawnMob();s.x=m.x+rand(-30,30);s.y=m.y+rand(-30,30);if(solid(s.x,s.y)){s.x=m.x;s.y=m.y;}}toast('잡몹을 소환했다!','#ffb3b3');}
    if(p==='puddles'){for(let i=0;i<4;i++){const px=P.x+rand(-50,50),py=P.y+rand(-50,50);world.tele.push({type:'circle',x:px,y:py,r:18,t:tel+.2,max:tel+.2,cb:()=>{world.puddles.push({x:px,y:py,r:18,life:14});spark(px,py,'#a3e635',10);if(Math.hypot(P.x-px,P.y-py)<18)hurtPlayer(m.atk*.8,m.rad,m);}});}}
    if(p==='pull'){world.tele.push({type:'circle',x:m.x,y:m.y,r:120,t:tel,max:tel,follow:m,col:'rgba(120,180,255,',cb:()=>{m.pulling=1.6;}});}
    if(p==='blink'){m.blinkT=1;spark(m.x,m.y,m.col,14);const a=rand(0,6.28);const nx=P.x+Math.cos(a)*90,ny=P.y+Math.sin(a)*90;if(!solid(nx,ny)){m.x=nx;m.y=ny;}spark(m.x,m.y,m.col,14);m.patT=.6;}
  }
  if(m.pulling>0){m.pulling-=dt;moveBody(P,(m.x-P.x)/(d||1)*55*dt,(m.y-P.y)/(d||1)*55*dt,5);}
  if(d<m.r+6)hurtPlayer(m.atk,m.rad,m);
}
function pointLineDist(p,x,y,dx,dy,len){const t=clamp((p.x-x)*dx+(p.y-y)*dy,0,len);return Math.hypot(p.x-(x+dx*t),p.y-(y+dy*t));}
function eShot(m,dx,dy,spd,mul){world.eshots.push({x:m.x,y:m.y,vx:dx*spd,vy:dy*spd,dmg:m.atk*mul,rad:m.rad,col:m.col,life:3,src:m});}

/* ---------------- 플레이어 피해 ---------------- */
function addContam(v){if(P&&P.buffs&&P.buffs.guard>0)return;P.contam=clamp(P.contam+v*P.st.contam,0,100);}
function hurtPlayer(raw,rad,src){
  if(P.inv>0||P.dead||P.buffs.thesis>0)return;
  const c=Game.char;let dmg=raw*50/(50+P.st.def);
  const sh=SHIELDS[c.shieldT].r[rad]||0;dmg*=1-sh;
  if(P.buffs.shield>0)dmg*=(rad==='gamma'||rad==='xray')?.2:.4;
  if(P.buffs.guard>0)dmg*=.5;
  if(c.job==='gen'&&P.buffs.toggleOn)dmg*=1.2;
  if(c.job==='gen'&&!P.buffs.toggleOn&&c.lv>=15)dmg*=.7;
  if(src&&src.L-c.lv>=5)dmg*=1.3;
  dmg*=rand(.9,1.1);
  if(P.shieldAbs>0){const a=Math.min(P.shieldAbs,dmg);P.shieldAbs-=a;dmg-=a;}
  P.hp-=dmg;P.inv=.6;Game.shake=Math.max(Game.shake,3);Game.flash=.12;Sound.hurt();
  num(P.x,P.y-12,Math.round(dmg),'#ff6b6b');
  const cm={alpha:14,beta:7,gamma:3,xray:2,neutron:5}[rad]||3;addContam(cm);
  if(src&&!src.boss){const dx=P.x-src.x,dy=P.y-src.y,l=Math.hypot(dx,dy)||1;moveBody(P,dx/l*8,dy/l*8,5);}
  if(P.hp<=0)playerDie();
}
function playerDie(){
  P.dead=true;P.hp=0;const c=Game.char;const loss=Math.floor(c.exp*.05);c.exp-=loss;saveChar();Sound.boom();
  setTimeout(()=>{dialog([["안내 AI '엘라라'",`쓰러지셨어요… 경험치 ${fmt(loss)}을(를) 잃었어요.\n로비 의무실에서 깨어납니다. `]],()=>{P.dead=false;P.hp=P.st.hp;P.mp=P.st.mp;P.contam=0;P.buffs={};enterLobby();});},700);
}

/* ---------------- 플레이어 공격 ---------------- */
function nearestMob(range,from){from=from||P;let best=null,bd=range;for(const m of world.mobs){if(m.hp<=0||(m.hide>0))continue;const d=Math.hypot(m.x-from.x,m.y-from.y);if(d<bd){bd=d;best=m;}}return best;}
function dmgMob(m,mult,opt={}){
  if(m.hp<=0||m.hide>0)return;
  const c=Game.char;let a=P.st.atk*mult*(opt.skill?P.st.skill:1);
  if(P.buffs.allnight>0)a*=1.5;if(P.buffs.paper>0)a*=1.5;if(P.buffs.smear>0)a*=1.6;
  if(P.buffs.colli>0&&!opt.noColli){a*=2;P.buffs.colli=0;}
  if(c.job==='ndt'&&Math.hypot(m.x-P.x,m.y-P.y)>70)a*=1+P.st.far;
  let dmg=a*50/(50+m.def);if(m.vuln>0)dmg*=1.3;
  let crit=Math.random()<P.st.crit||m.critMark>0||P.buffs.xvision>0;if(crit)dmg*=1.5;
  dmg*=rand(.9,1.1);dmg=Math.max(1,Math.round(dmg));
  m.hp-=dmg;m.flash=.12;
  num(m.x,m.y-m.r-4,dmg,crit?'#ffd400':'#ffffff',crit);
  if(crit)Sound.crit();else Sound.hit();
  if(!m.boss&&!opt.nokb){const dx=m.x-P.x,dy=m.y-P.y,l=Math.hypot(dx,dy)||1;m.kb.x=dx/l*120;m.kb.y=dy/l*120;}
  Game.hitstop=Math.max(Game.hitstop,crit?.06:.03);
  spark(m.x,m.y,m.col,crit?8:4);world.fx.push({type:'impact',x:m.x,y:m.y-4,t:.16,max:.16,col:crit?'#ffd400':'#ffffff',r:Math.random()});
  if(m.beh==='mimic'&&m.st==='sleep')m.st='awake';
  if(m.hp<=0)killMob(m);
}
function killMob(m){
  const c=Game.char;
  spark(m.x,m.y,m.col,m.boss?50:14);ring(m.x,m.y,m.boss?70:22,m.col);Sound.pop();for(let i=0;i<4;i++)world.parts.push({x:m.x+rand(-4,4),y:m.y+rand(-4,4),vx:rand(-20,20),vy:rand(-50,-20),life:.6,max:.6,col:m.col,s:2.5,glow:1});
  if(m.beh==='tank')world.puddles.push({x:m.x,y:m.y,r:14,life:12});
  if(m.beh==='split'&&!m.child){for(let i=0;i<2;i++){const s=spawnMob();s.x=m.x+rand(-8,8);s.y=m.y+rand(-8,8);s.hp=s.max=Math.round(m.max*.35);s.sz=.7;s.r=5;s.child=1;s.exp=Math.round(m.exp*.3);s.name=m.name;s.shape=m.shape;s.col=m.col;s.beh='chase';s.rad=m.rad;}}
  gainExp(m.exp);c.gold+=m.gold;
  if(!c.dex[m.name]){c.dex[m.name]=1;toast(`📖 도감 등록: ${m.name}`,'#9fe3ff');}
  if(!m.boss)learn('m:'+m.name);
  if(m.boss){
    world.boss=null;world.bossDone=true;Game.shake=12;Sound.boom();Sound.setBoss(false);Game.slow=.7;Game.flash=.35;
    const first=!c.cleared[world.z];c.cleared[world.z]=1;learn('z:'+world.z,first);
    if(first){c.zoneMax=Math.max(c.zoneMax,world.z+2>20?20:world.z+2);Sound.quest();
      Game.banner={t:`구역 ${world.z+1} 정화 완료!`,s:world.z<19?`구역 ${world.z+2} 개방 · 상식: ${world.Z.card}`:'모든 구역 정화!',life:4};
      c.gold+=world.z*50+100;c.pot.hp+=2;
      if(world.z===5&&!c.job)setTimeout(()=>toast('Lv.15가 되면 교관에게 전직할 수 있어요!','#ffd479'),1500);
      if(world.z===19&&!c.ending)setTimeout(showEnding,2500);
    }else{Game.banner={t:'보스 재처치!',s:'보상 획득',life:2.5};}
    world.kills=0;world.bossNeed=20;
    saveChar();
  }else{world.kills++;c.kills[world.z]=(c.kills[world.z]||0)+1;
    if(!world.boss&&world.kills>=world.bossNeed)spawnMob(true);}
}
function gainExp(e){
  const c=Game.char;if(c.lv>=50){c.exp=0;return;}
  c.exp+=Math.round(e*P.st.exp);
  while(c.lv<50&&c.exp>=expNext(c.lv)){c.exp-=expNext(c.lv);c.lv++;if(c.lv>=50)c.exp=0;levelUp();}
  if(c.lv>=50)c.exp=0;
}
function levelUp(){
  const c=Game.char;recalc(true);P.hp=P.st.hp;P.mp=P.st.mp;Sound.lvl();Game.flash=.25;
  ring(P.x,P.y,40,'#ffe066');spark(P.x,P.y,'#ffe066',30);world.fx.push({type:'pillar',x:P.x,y:P.y,t:1.2,max:1.2});for(let i=0;i<16;i++)world.parts.push({x:P.x+rand(-8,8),y:P.y-rand(0,10),vx:rand(-6,6),vy:rand(-70,-30),life:1,max:1,col:'#fde68a',s:2,glow:1});
  Game.banner={t:`LEVEL UP! Lv.${c.lv}`,s:'',life:2};
  for(const k in SKILLS){const s=SKILLS[k];if(s.lv===c.lv&&(!s.job||s.job===c.job)&&(!s.job||s.lv>15)){toast(`새 스킬: ${s.n}`,'#9fe3ff');Game.introQ.push({skill:k});}}
  if(c.lv===15&&!c.job)toast('전직 가능 레벨! 구역 6 보스를 잡고 교관을 찾아가세요.','#ffd479');
  for(const ct of CERTS)if(ct.lv===c.lv&&!c.certs.includes(ct.id))toast('…어딘가에서 시험의 기운이 느껴진다.','#fff59d');
  saveChar();
}

function basicAttack(){
  const c=Game.char;if(P.atkCd>0)return;
  const haste=(P.buffs.haste>0?1.4:1)*(P.buffs.coffee>0?1.3:1);
  const ranged=c.job==='res'||c.job==='ndt'||c.job==='gen';
  const t=nearestMob(ranged?170:70);if(t){const dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.face={x:dx/l,y:dy/l};}
  P.combo=(P.combo+1)%3;P.atkFlash=.12;const fx=P.face.x,fy=P.face.y,ang=Math.atan2(fy,fx);
  const gx=P.x+fx*12,gy=P.y-9+fy*12; // 총구 위치
  const melee=(R,arc,mult,col,kb)=>{world.fx.push({type:'slash',x:P.x,y:P.y,a:ang,r:R,t:.15,max:.15,col,w:arc});
    for(const m of world.mobs){if(m.hp<=0)continue;const dx=m.x-P.x,dy=m.y-P.y,d=Math.hypot(dx,dy);if(d>R+m.r)continue;
      let da=Math.atan2(dy,dx)-ang;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<arc||d<m.r+4){dmgMob(m,mult);if(kb&&!m.boss){m.kb.x*=kb;m.kb.y*=kb;}}}};
  switch(c.job){
    case 'res':{ // 분석 구체: 유도탄, 4발째 약점 표시
      P.atkCd=.36/haste;P.resN=(P.resN||0)+1;const mark=P.resN%4===0;
      const b=pShot(gx,gy,fx,fy,170,.85,mark?'#a7f3d0':'#4ade80',false,mark?5:3.5);b.home=1;b.basic=1;if(mark)b.mark=3;b.life=1.6;
      Sound.tone(mark?1320:880,.07,'sine',.04,1.4);break;}
    case 'ndt':{ // 투과 촬영: 관통 X선
      P.atkCd=.45/haste;const L=160;beamFx(gx,gy,fx,fy,L,'#c084fc',3);
      for(const m of world.mobs)if(pointLineDist(m,gx,gy,fx,fy,L)<m.r+4)dmgMob(m,.85,{nokb:true});
      world.fx.push({type:'impact',x:gx+fx*L,y:gy+fy*L,t:.15,max:.15,col:'#e9d5ff',r:0});
      Sound.tone(1500,.08,'sawtooth',.025,.3);break;}
    case 'grad':{ // 빠른 2연타 + 레포트 투척
      if(P.combo<2){P.atkCd=.22/haste;melee(24,1.0,.8,'#f87171');Sound.tone(420,.04,'triangle',.025,1.6);}
      else{P.atkCd=.42/haste;for(const d of[-.25,0,.25]){const b=pShot(gx,gy,Math.cos(ang+d),Math.sin(ang+d),210,.6,'#f8fafc',false,3);b.basic=1;b.paper=1;b.life=.7;}Sound.whoosh();}
      break;}
    case 'open':{ // 흡착 강타: 넓고 묵직한 근접, 3타 충격파
      P.atkCd=.45/haste;melee(32,1.4,1.4,'#facc15',1.3);clearPuddles(P.x+fx*20,P.y+fy*20,20);P.contam=Math.max(0,P.contam-1);
      Sound.tone(120,.14,'sine',.12,.5);Sound.noise(.08,.05);Game.shake=Math.max(Game.shake,2);
      if(P.combo===2){ring(P.x,P.y,38,'#facc15');for(const m of world.mobs)if(Math.hypot(m.x-P.x,m.y-P.y)<38+m.r)dmgMob(m,1.0);spark(P.x,P.y,'#facc15',14);Game.shake=4;}
      break;}
    case 'gen':{
      if(P.buffs.toggleOn){P.atkCd=.34/haste;const L=130;beamFx(gx,gy,fx,fy,L,'#38bdf8',4);
        for(const m of world.mobs)if(pointLineDist(m,gx,gy,fx,fy,L)<m.r+6)dmgMob(m,1.17,{nokb:true});Sound.tone(900,.05,'sawtooth',.03);}
      else{P.atkCd=.24/haste;const b=pShot(gx,gy,fx+rand(-.05,.05),fy+rand(-.05,.05),280,.7,'#7dd3fc',false,2.5);b.basic=1;Sound.tone(1200,.035,'square',.02,.6);}
      break;}
    default:{ // 견습: 제염 샷 근접 3연타
      P.atkCd=.34/haste;melee(26,1.1,P.combo===2?1.4:1,P.combo===2?'#bff4ff':'#7fd1ff');Sound.tone(300,.04,'triangle',.02,1.4);}
  }
}
function castSkill(k){
  const c=Game.char,s=SKILLS[k];if(!s||c.lv<s.lv||(s.job&&s.job!==c.job))return;
  if((P.cds[k]||0)>0){toast(`${s.n}: 쿨타임 ${(P.cds[k]).toFixed(1)}초`,'#aaa');return;}
  if(P.mp<s.mp){toast('MP가 부족합니다','#88aaff');return;}
  P.mp-=s.mp;P.cds[k]=s.cd*P.st.cd;Sound.forSkill(k);world.fx.push({type:'cast',x:P.x,y:P.y,t:.5,max:.5,col:s.job?JOBS[s.job].col:'#7fd1ff'});
  const t=nearestMob(200);if(t&&!['dash'].includes(k)){const dx=t.x-P.x,dy=t.y-P.y,l=Math.hypot(dx,dy)||1;P.face={x:dx/l,y:dy/l};}
  const fx=P.face.x,fy=P.face.y;
  const aoe=(R,mult,col)=>{ring(P.x,P.y,R,col);for(const m of world.mobs)if(Math.hypot(m.x-P.x,m.y-P.y)<R+m.r)dmgMob(m,mult,{skill:1});};
  const beam=(L,wid,mult,col,ox,oy,dx,dy)=>{ox=ox??P.x;oy=oy??P.y;dx=dx??fx;dy=dy??fy;beamFx(ox,oy,dx,dy,L,col,wid);for(const m of world.mobs)if(pointLineDist(m,ox,oy,dx,dy,L)<m.r+wid/2)dmgMob(m,mult,{skill:1,nokb:true});};
  switch(k){
    case 'shield':P.buffs.shield=3;ring(P.x,P.y,18,'#cbd5e1');break;
    case 'dash':{const ox=P.x,oy=P.y;P.trail=P.trail||[];for(let i=0;i<4;i++)P.trail.push({x:ox+fx*i*22,y:oy+fy*i*22,f:fx,t:.3-i*.04});for(let i=0;i<18;i++)moveBody(P,fx*5,fy*5,5);P.inv=.3;
      for(const m of world.mobs)if(pointLineDist(m,ox,oy,fx,fy,Math.hypot(P.x-ox,P.y-oy))<m.r+8)dmgMob(m,1.5,{skill:1});
      for(let i=0;i<10;i++)world.parts.push({x:ox+(P.x-ox)*i/10,y:oy+(P.y-oy)*i/10,vx:0,vy:0,life:.3,max:.3,col:'#9fe3ff',s:3});Game.shake=3;break;}
    case 'burst':aoe(55,2.2,'#7fd1ff');clearPuddles(P.x,P.y,60);spark(P.x,P.y,'#7fd1ff',30);Game.shake=5;Sound.boom();break;
    case 'haste':P.buffs.haste=6;break;
    case 'measure':{const dur=10;for(const m of world.mobs)if(Math.abs(m.x-P.x)<W/2&&Math.abs(m.y-P.y)<H/2)m.vuln=dur;ring(P.x,P.y,140,'#86efac');break;}
    case 'drone':P.drones=10;break;
    case 'analyze':ring(P.x,P.y,70,'#4ade80');for(const m of world.mobs)if(Math.hypot(m.x-P.x,m.y-P.y)<70){m.vuln=10;}break;
    case 'storm':for(let i=0;i<6;i++)setTimeout(()=>{if(Game.scene==='play'&&world)aoe(70,.9,'#4ade80');},i*180);break;
    case 'paper':P.cds={};P.cds.paper=s.cd*P.st.cd;P.buffs.paper=10;Game.flash=.2;toast('논문 게재 승인! 모든 쿨타임 초기화','#4ade80');break;
    case 'pbeam':beam(190,10,2.5,'#c084fc');break;
    case 'colli':P.buffs.colli=6;break;
    case 'film':ring(P.x,P.y,90,'#e9d5ff');for(const m of world.mobs)if(Math.hypot(m.x-P.x,m.y-P.y)<90)m.critMark=8;break;
    case 'omni':for(let i=0;i<8;i++){const a=i*Math.PI/4;beam(200,10,3,'#c084fc',P.x,P.y,Math.cos(a),Math.sin(a));}Game.shake=6;break;
    case 'allnight':P.buffs.allnight=8;break;
    case 'rewind':{const h=P.hist[0];if(h){spark(P.x,P.y,'#f87171',16);P.x=h.x;P.y=h.y;P.hp=Math.max(P.hp,h.hp);spark(P.x,P.y,'#f87171',16);toast('회귀!','#f87171');}break;}
    case 'prof':{const r=Math.random();if(r<.3){P.hp=P.st.hp;P.buffs.paper=6;toast('교수님: "아주 좋아!" (HP 전부 회복 + 공격력 +50%)','#86efac');}
      else if(r<.75){aoe(80,1.8,'#f87171');toast('교수님: "음… 다시 해 봐."','#ddd');}
      else{P.stunSelf=1.2;toast('교수님: "이거 내일까지 다시 해 와." (1.2초 경직)','#ff8a8a');}break;}
    case 'thesis':P.buffs.thesis=5;Game.flash=.4;for(const m of world.mobs)if(Math.abs(m.x-P.x)<W/2&&Math.abs(m.y-P.y)<H/2)dmgMob(m,6,{skill:1});Game.shake=10;Sound.boom();toast('졸업 논문 통과!','#ffd400');break;
    case 'pad':{const n=clearPuddles(P.x,P.y,80);P.shieldAbs=P.st.hp*.2+n*10;P.buffs.pad=8;P.contam=Math.max(0,P.contam-20);ring(P.x,P.y,80,'#facc15');break;}
    case 'hood':world.vort.push({x:P.x+fx*50,y:P.y+fy*50,t:3,tick:0});break;
    case 'smear':P.buffs.smear=8;break;
    case 'fulldecon':aoe(150,4,'#facc15');world.puddles=world.puddles.filter(p=>false);P.hp=Math.min(P.st.hp,P.hp+P.st.hp*.3);P.contam=0;Game.shake=10;Sound.boom();break;
    case 'xvision':P.buffs.xvision=6;Game.flash=.15;break;
    case 'coffee':P.mp=Math.min(P.st.mp,P.mp+P.st.mp*.5);P.stunSelf=0;P.buffs.coffee=5;spark(P.x,P.y,'#a16207',14);break;
    case 'guard':P.buffs.guard=4;ring(P.x,P.y,22,'#facc15');break;
    case 'dualbeam':{const a=Math.atan2(fy,fx);for(const d of[-.26,.26])beam(170,9,1.8,'#38bdf8',P.x,P.y,Math.cos(a+d),Math.sin(a+d));break;}
    case 'toggle':P.buffs.toggleOn=!P.buffs.toggleOn;P.cds.toggle=1;toast(P.buffs.toggleOn?'전원 ON — 빔 공격 모드':'전원 OFF — 방어 모드',P.buffs.toggleOn?'#38bdf8':'#94a3b8');break;
    case 'kvp':P.charge=.6;break;
    case 'pulse':for(let i=0;i<8;i++)setTimeout(()=>{if(world)pShot(P.x,P.y,P.face.x+rand(-.08,.08),P.face.y+rand(-.08,.08),260,.8,'#38bdf8',false);},i*70);break;
    case 'linac':beam(480,24,8,'#7dd3fc');Game.shake=12;Sound.boom();break;
  }
}
function pShot(x,y,dx,dy,spd,mult,col,pierce,size){const l=Math.hypot(dx,dy)||1;const b={x,y,vx:dx/l*spd,vy:dy/l*spd,spd,mult,col,pierce,life:1.4,hit:new Set(),size:size||3};world.shots.push(b);return b;}
function clearPuddles(x,y,r){const n=world.puddles.length;world.puddles=world.puddles.filter(p=>Math.hypot(p.x-x,p.y-y)>r);return n-world.puddles.length;}

/* ---------------- 효과 ---------------- */
function spark(x,y,col,n){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(20,110);world.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.6),max:.6,col,s:rand(1.5,3)});}}
function ring(x,y,r,col){world.fx.push({type:'ring',x,y,r,t:.35,max:.35,col});}
function beamFx(x,y,dx,dy,len,col,w){world.fx.push({type:'beam',x,y,dx,dy,len,col,w,t:.25,max:.25});}
function num(x,y,v,col,big){world.nums.push({x:x+rand(-4,4),y,v,col,big,t:.8});}

/* ---------------- 상호작용 ---------------- */
function nearestObj(){let best=null,bd=26;for(const o of world.objs){const d=Math.hypot(o.x-P.x,o.y-P.y);if(d<bd){bd=d;best=o;}}return best;}
function interact(){
  const o=nearestObj();if(!o)return;const c=Game.char;
  switch(o.act){
    case 'instructor':return instructor();
    case 'shop':return showShop();
    case 'decon':P.hp=P.st.hp;P.mp=P.st.mp;P.contam=0;Sound.quest();ring(P.x,P.y,30,'#34d399');toast('제염 완료: HP·MP 회복, 오염도 0','#34d399');return;
    case 'dress':return showCreate(true);
    case 'board':return showLeaderboard();
    case 'portal':return showPortal();
    case 'exit':saveChar();return enterLobby();
    case 'certobj':{const prog=c.certProg[o.cert]||(c.certProg[o.cert]=[]);if(!prog.includes(o.idx))prog.push(o.idx);
      world.objs=world.objs.filter(x=>x!==o);spark(o.x,o.y,'#fff59d',14);Sound.coin();
      const ct=CERTS.find(x=>x.id===o.cert);toast(`${o.name} 조사 (${prog.length}/${ct.count})`,'#fff59d');
      if(prog.length>=ct.count){const p=freeSpot();world.objs.push({x:P.x+20,y:P.y,name:'시험관',col:'#fde047',act:'exam',cert:ct.id,npc:1,sub:ct.name});
        dialog([['???','…자네, 현장을 보는 눈이 있군.\n방사선안전관리자에게 꼭 필요한 자격이 하나 있지. 시험을 보겠나?']]);}
      saveChar();return;}
    case 'exam':return certExam(o);
    case 'note':world.objs=world.objs.filter(x=>x!==o);spark(o.x,o.y,'#93c5fd',16);return learn('p:'+world.z,true);
  }
}

  else{const z=c.zoneMax-1,Z=ZONES[z];hint=`다음 임무: 구역 ${z+1} "${Z.n}" 정화.\n권장 레벨 Lv ${Z.lo}~${Z.hi}. 몬스터를 처치하면 보스가 나타난다.`;}
  if(c.lv>=15&&!c.cleared[5]&&!c.job)hint+='\n\n전직하려면 먼저 구역 6 "산업 조사시설"의 보스를 처치하게.';

  dialog([['교관',hint]]);
}

        });});};

    ask();
  });
}

function showShop(){
  const c=Game.char;
  const wPrice=t=>Math.round(35*Math.pow(1.7,t)),aPrice=t=>Math.round(40*Math.pow(1.7,t));
  const items=[
    ['HP 포션 (HP 40% 회복)',20,()=>true,()=>c.pot.hp++,`보유 ${c.pot.hp}개`,1],
    ['MP 포션 (MP 50% 회복)',18,()=>true,()=>c.pot.mp++,`보유 ${c.pot.mp}개`,1],
    ['제염 키트 (오염도 −50)',25,()=>true,()=>c.pot.decon++,`보유 ${c.pot.decon}개`,1],
    [`제염 건 강화 +${c.weapon+1} (공격력 +6)`,wPrice(c.weapon),()=>c.weapon<9&&c.lv>=c.weapon*5,()=>c.weapon++,c.weapon>=9?'최대 강화':`필요 Lv ${c.weapon*5}`],
    [`방호복 강화 +${c.armor+1} (방어력 +4, HP +20)`,aPrice(c.armor),()=>c.armor<9&&c.lv>=c.armor*5,()=>c.armor++,c.armor>=9?'최대 강화':`필요 Lv ${c.armor*5}`]];
  const SP=[0,40,250,1200,4500];
  SHIELDS.forEach((sh,i)=>{if(i>c.shieldT)items.push([`${sh.n} (${Object.entries(sh.r).map(([k,v])=>RADN[k]+' −'+Math.round(v*100)+'%').join(', ')}${sh.spd?', 이동 −5%':''})`,SP[i],()=>true,()=>c.shieldT=i,'차폐구 교체']);});
  let h=`<h2>장비실</h2><p>보유 골드: <b style="color:#ffd479">${fmt(c.gold)} G</b> · 현재 차폐구: ${SHIELDS[c.shieldT].n}</p><p class="small">포션·제염키트는 개수 제한 없이 살 수 있어요.</p><table>`;
  items.forEach((it,i)=>{const ok=it[2]()&&c.gold>=it[1];h+=`<tr><td>${esc(it[0])}<br><span class="small">${it[4]}</span></td><td>${fmt(it[1])}G</td><td><button data-i="${i}" data-n="1" ${ok?'':'disabled'}>구매</button>${it[5]?`<button data-i="${i}" data-n="10" ${it[2]()&&c.gold>=it[1]*10?'':'disabled'}>10개</button>`:''}</td></tr>`;});
  h+='</table><button id="bX">닫기</button>';
  openPanel(h,()=>{pbox.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i],n=+b.dataset.n;if(c.gold>=it[1]*n&&it[2]()){c.gold-=it[1]*n;for(let k=0;k<n;k++)it[3]();Sound.coin();recalc();saveChar();showShop();}});$('#bX').onclick=closePanel;});
}

  if(tab==='board_back')return showMenu('status');
  if(tab==='set'){
    h+=`<h2>설정</h2><label class="chk"><input type="checkbox" id="snd" ${Sound.on?'checked':''}> 효과음</label><label class="chk"><input type="checkbox" id="bgm" ${Sound.bgmOn?'checked':''}> 배경음</label><label class="chk"><input type="checkbox" id="keyg" ${Game.hideKeys?'':'checked'}> 화면에 조작키 안내 표시 (H 키로도 전환)</label><label class="chk"><input type="checkbox" id="lowfx" ${Game.lowfx?'checked':''}> 이펙트 간략화 (저사양 기기)</label>

/* ---------------- 업데이트 ---------------- */
let last=performance.now();
function loop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;if(Game.slow>0){Game.slow-=dt;dt*=.35;}
  let held=false;
  if(Game.scene==='play'&&!Game.paused&&world){
    if(Game.hitstop>0){Game.hitstop-=dt;held=true;}else update(dt);
  }
  if(pressed['escape']){delete pressed['escape'];if(Game.scene==='play'){if(panel.classList.contains('show'))closePanel();else showMenu();}}
  if(!held)for(const k in pressed)delete pressed[k];
  if(Game.scene==='play'&&Game.introQ.length&&!panel.classList.contains('show')&&!(P&&P.dead))showIntro(Game.introQ.shift());
  if(Game.fade>0)Game.fade=Math.max(0,Game.fade-Math.min(.05,dt*3)*1.2);
  render();
  requestAnimationFrame(loop);
}
function update(dt){
  Game.t+=dt;const c=Game.char,s=P.st;
  if(Game.shake>0)Game.shake=Math.max(0,Game.shake-dt*30);if(Game.flash>0)Game.flash-=dt;
  // buffs/cds
  for(const k in P.cds){P.cds[k]-=dt;if(P.cds[k]<=0)delete P.cds[k];}
  for(const k in P.buffs){if(typeof P.buffs[k]==='number'&&k!=='toggleOn'){P.buffs[k]-=dt;if(P.buffs[k]<=0)delete P.buffs[k];}}
  if(P.inv>0)P.inv-=dt;if(P.atkCd>0)P.atkCd-=dt;if(P.dashCd>0)P.dashCd-=dt;if(P.potCd>0)P.potCd-=dt;
  // history for rewind
  P.histT=(P.histT||0)+dt;if(P.histT>.1){P.histT=0;P.hist.push({x:P.x,y:P.y,hp:P.hp});if(P.hist.length>30)P.hist.shift();}
  // regen
  P.mp=Math.min(s.mp,P.mp+s.mpregen*dt*(1+c.lv/25));
  if(s.regen)P.hp=Math.min(s.hp,P.hp+s.regen*dt*(1+c.lv/10));
  if(P.buffs.allnight>0)P.hp=Math.max(1,P.hp-s.hp*.01*dt);
  if(P.contam>=100){P.hp-=s.hp*.012*dt;if(P.hp<=0&&!P.dead)playerDie();}
  if(P.contam>=60&&Math.floor(Game.t*6)!==Math.floor((Game.t-dt)*6))Sound.tick();
  // input
  let mx=0,my=0;
  if(keys['arrowleft'])mx-=1;if(keys['arrowright'])mx+=1;if(keys['arrowup'])my-=1;if(keys['arrowdown'])my+=1;
  mx+=touch.dx;my+=touch.dy;const ml=Math.hypot(mx,my);
  if(P.stunSelf>0){P.stunSelf-=dt;mx=my=0;}
  if(P.dead){mx=my=0;}
  let spd=s.spd*(P.buffs.haste>0?1.4:1)*(P.contam>=50?.85:1)*(c.job==='gen'&&!P.buffs.toggleOn&&c.lv>=15?1.15:1);
  if(ml>.15){mx/=Math.max(1,ml);my/=Math.max(1,ml);P.face={x:mx/Math.hypot(mx,my),y:my/Math.hypot(mx,my)};moveBody(P,mx*spd*dt,my*spd*dt,5);P.walk+=dt*8;}
  if(P.dashT>0){P.dashT-=dt;moveBody(P,P.face.x*230*dt,P.face.y*230*dt,5);}
  if(!P.dead&&!(P.stunSelf>0)){
    if(keys['ctrl']||touch.atk)if(world.type==='zone')basicAttack();
    if(pressed[' ']&&P.dashCd<=0){P.dashCd=.9;P.dashT=.16;P.inv=.25;P.trailT=.2;spark(P.x,P.y,'#9fe3ff',6);Sound.whoosh();}
    if(pressed['tab']){if(!c.job){P.page='common';toast('직업 스킬 탭은 Lv.15 전직 후 열립니다','#aaa');}else{P.page=P.page==='job'?'common':'job';toast(P.page==='job'?`직업 스킬 탭 (${JOBS[c.job].short})`:'공통 스킬 탭',P.page==='job'?JOBS[c.job].col:'#9fe3ff');Sound.tick();}}
    const pg=pageSkills();
    ['q','w','e','r'].forEach((k,i)=>{if(pressed[k]){const sk=pg[i];if(!sk)return;const S=SKILLS[sk];
      if(c.lv<S.lv)return toast(`${S.n}: Lv.${S.lv}에 해금`,'#aaa');
      if(world.type!=='zone')return toast('로비에서는 스킬을 쓸 수 없습니다','#aaa');castSkill(sk);}});
    if(pressed['alt']){if(!c.job)toast('직업 특수 스킬은 전직 후 사용할 수 있습니다','#aaa');else if(world.type!=='zone')toast('로비에서는 스킬을 쓸 수 없습니다','#aaa');else castSkill(jobSpecial(c.job));}
    if(pressed['z'])interact();
    if(pressed['h']){Game.hideKeys=!Game.hideKeys;Store.set('vrrso_hidekeys',Game.hideKeys);}
    if(pressed['shift']){
      if(P.potCd>0)toast(`포션 쿨타임 ${P.potCd.toFixed(1)}초`,'#aaa');
      else if(c.pot.hp>0&&P.hp<s.hp){c.pot.hp--;P.hp=Math.min(s.hp,P.hp+s.hp*.4);P.potCd=10;spark(P.x,P.y,'#f87171',12);Sound.heal();}
      else if(c.pot.hp<=0)toast('HP 포션이 없습니다','#aaa');}
    if(pressed['1']&&c.pot.mp>0&&P.mp<s.mp){c.pot.mp--;P.mp=Math.min(s.mp,P.mp+s.mp*.5);spark(P.x,P.y,'#60a5fa',12);}
    if(pressed['2']&&c.pot.decon>0&&P.contam>0){c.pot.decon--;P.contam=Math.max(0,P.contam-50);spark(P.x,P.y,'#34d399',12);}
  }
  // charge (kvp)
  if(P.charge>0){P.charge-=dt;if(Math.random()<.5)world.parts.push({x:P.x+rand(-10,10),y:P.y+rand(-10,10),vx:0,vy:0,life:.2,max:.2,col:'#7dd3fc',s:2});
    if(P.charge<=0){pShot(P.x,P.y,P.face.x,P.face.y,240,3,'#7dd3fc',true,7);Game.shake=4;}}
  // drones
  if(P.drones>0){P.drones-=dt;P.droneT=(P.droneT||0)-dt;if(P.droneT<=0){P.droneT=.45;const t=nearestMob(150);if(t){const dx=Math.cos(Game.t*3)*16,dy=Math.sin(Game.t*3)*16;pShot(P.x+dx,P.y+dy,t.x-P.x-dx,t.y-P.y-dy,230,.7,'#4ade80',false);}}}
  // vortex
  for(const v of world.vort){v.t-=dt;v.tick-=dt;for(const m of world.mobs){const d=Math.hypot(v.x-m.x,v.y-m.y);if(d<90&&!m.boss){moveBody(m,(v.x-m.x)/(d||1)*90*dt,(v.y-m.y)/(d||1)*90*dt,m.r*.7);}}
    if(v.tick<=0){v.tick=.3;for(const m of world.mobs)if(Math.hypot(v.x-m.x,v.y-m.y)<40)dmgMob(m,.5,{skill:1,nokb:true});}
    if(Math.random()<.6)world.parts.push({x:v.x+rand(-40,40),y:v.y+rand(-40,40),vx:0,vy:0,life:.3,max:.3,col:'#facc15',s:2});}
  world.vort=world.vort.filter(v=>v.t>0);
  // puddles
  for(const p of world.puddles){if(!p.perm)p.life-=dt;if(Math.hypot(p.x-P.x,p.y-P.y)<p.r)addContam(9*dt);}
  world.puddles=world.puddles.filter(p=>p.life>0);
  // mobs
  if(world.type==='zone'){
    for(const m of world.mobs)if(m.hp>0)mobAI(m,dt);
    world.mobs=world.mobs.filter(m=>m.hp>0);
    world.spawnT-=dt;const cap=world.boss?3:7;

  if(Game.banner){Game.banner.life-=dt;if(Game.banner.life<=0)Game.banner=null;}

  const ww=world.w*TILE,wh=world.h*TILE;

  if(P.trailT>0){P.trailT-=dt;P.trail.push({x:P.x,y:P.y,f:P.face.x,t:.22});}
  if(ml>.15&&!P.dead){P.stepT=(P.stepT||0)-dt;if(P.stepT<=0){P.stepT=.3;Sound.step();for(let i=0;i<2;i++)world.parts.push({x:P.x+rand(-3,3),y:P.y+1,vx:rand(-10,10),vy:rand(-8,-2),life:.35,max:.35,col:'rgba(200,200,200,.6)',s:1.5});}}

function drawMob(g,m){
  const x=Math.round(m.x),y=Math.round(m.y),s=m.sz,col=m.flash>0?'#ffffff':m.col;const t=m.t;
  if(m.boss)drawGlow(g,x,y-4,46,m.col,.35+Math.sin(t*4)*.12);else if(m.beh==='wisp'||m.shape==='wisp'||m.shape==='fire')drawGlow(g,x,y-2,14,m.col,.5);
  g.save();g.translate(x,y);g.scale(s,s);
  if(m.hide>0){g.globalAlpha=.25;}
  if(m.beh==='ghost'||m.shape==='ghost')g.globalAlpha*=.8;
  if(m.boss&&m.blinkT>0)g.globalAlpha=.35;
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-6,6,12,3);
  const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(a,b,w,h);};
  const C=(c,a,b,r)=>{g.fillStyle=c;g.beginPath();g.arc(a,b,r,0,6.283);g.fill();};
  const b2=Math.sin(t*6)*1;
  switch(m.shape){
    case 'slime':{const sq=1+Math.sin(t*5)*.1;g.save();g.scale(1/sq,sq);C(col,0,2,7);R(col,-7,2,14,5);g.restore();R('#111',-3,0,2,2);R('#111',2,0,2,2);R('rgba(255,255,255,.5)',-4,-3,3,2);break;}
    case 'bat':{const f=Math.sin(t*18)*3;C(col,0,-2+b2,4);g.fillStyle=col;g.beginPath();g.moveTo(-3,-2+b2);g.lineTo(-11,-6+f);g.lineTo(-7,1);g.closePath();g.fill();g.beginPath();g.moveTo(3,-2+b2);g.lineTo(11,-6+f);g.lineTo(7,1);g.closePath();g.fill();R('#fff',-2,-3+b2,1,1);R('#fff',1,-3+b2,1,1);break;}
    case 'wisp':{g.globalAlpha*=.35;C(col,0,-2+b2,8);g.globalAlpha/=.35;C(col,0,-2+b2,4.5);C('#fff',0,-3+b2,2);break;}
    case 'worm':{for(let i=3;i>=0;i--)C(i===0?col:shade(col,-.15*i),-i*4,Math.sin(t*6+i)*2,4-i*.4);R('#111',1,-2,1,1);break;}
    case 'jelly':{C(col,0,-3+b2,6);g.fillStyle=col;for(let i=-2;i<=2;i++)g.fillRect(i*2.5-1,1+b2,1.5,5+Math.sin(t*5+i)*2);g.globalAlpha*=.4;C('#fff',-2,-5+b2,2);g.globalAlpha/=.4;break;}
    case 'turret':{R(shade(col,-.3),-7,-2,14,9);R(col,-6,-9,12,8);const on=m.on!==false;R(on?'#ef4444':'#374151',-2,-7,4,4);if(on){g.globalAlpha*=.3;C('#ef4444',0,-5,6);g.globalAlpha/=.3;}break;}
    case 'fire':{for(let i=0;i<3;i++){C(i===0?col:i===1?'#fde047':'#fff',0,-2-i*2+Math.sin(t*10+i)*1,6-i*2);}break;}
    case 'disc':{g.save();g.rotate(t*3);R(col,-8,-2,16,4);R(col,-2,-8,4,16);g.restore();C(shade(col,-.3),0,0,5);C('#fff',0,0,2);break;}
    case 'spider':{g.strokeStyle=shade(col,-.3);g.lineWidth=1.2;for(let i=-1;i<=1;i+=2)for(let k=0;k<3;k++){g.beginPath();g.moveTo(0,0);g.lineTo(i*8,-3+k*4+Math.sin(t*12+k)*1.5);g.stroke();}C(col,0,0,5);R('#ef4444',-2,-2,1,1);R('#ef4444',1,-2,1,1);break;}
    case 'golem':{R(shade(col,-.25),-7,-12,14,16);R(col,-6,-13,12,14);R(shade(col,-.4),-9,-9,3,8);R(shade(col,-.4),6,-9,3,8);R('#fde047',-3,-9,2,2);R('#fde047',1,-9,2,2);break;}
    case 'mimic':{const open=m.st!=='sleep';R(shade(col,-.3),-7,-6,14,11);R(col,-7,-9-(open?3:0),14,4);if(open){R('#7f1d1d',-6,-6,12,3);R('#fff',-5,-6,2,2);R('#fff',3,-6,2,2);}R('#facc15',-1,-5,2,3);break;}
    case 'drone':{R(col,-5,-3+b2,10,5);R('#111',-1,-2+b2,2,2);R('#94a3b8',-9,-6+b2,6,1);R('#94a3b8',3,-6+b2,6,1);break;}
    case 'ghost':{g.fillStyle=col;g.beginPath();g.arc(0,-3+b2,6,Math.PI,0);g.lineTo(6,4+b2);for(let i=0;i<4;i++)g.lineTo(6-i*3-1.5,(i%2?4:1)+b2);g.lineTo(-6,4+b2);g.closePath();g.fill();R('#111',-3,-4+b2,2,2);R('#111',1,-4+b2,2,2);break;}
    case 'knight':{R('#475569',-5,-6,10,10);R(col,-4,-13,8,8);R('#111',-3,-10,6,1);R('#cbd5e1',6,-14,1,14);R(col,-7,-5,3,7);break;}
    case 'comet':{g.globalAlpha*=.4;g.fillStyle=col;g.beginPath();g.moveTo(-14,-6);g.lineTo(0,-3);g.lineTo(0,3);g.closePath();g.fill();g.globalAlpha/=.4;C(col,1,0,5);C('#fff',2,-1,2);break;}
    case 'glitch':{for(let i=0;i<5;i++){R(i%2?col:'#fff',-7+Math.round(Math.random()*4),-10+i*3,10+Math.round(Math.random()*4),2);}R('#000',-2,-6,4,2);break;}

  g.restore();

  if(m.critMark>0){g.fillStyle='#e9d5ff';g.fillRect(x-1,y-m.r*m.sz-10,2,4);}
  if(!m.boss&&m.hp<m.max){g.fillStyle='#000';g.fillRect(x-8,y-m.r*m.sz-8,16,2);g.fillStyle='#ef4444';g.fillRect(x-8,y-m.r*m.sz-8,16*m.hp/m.max,2);}
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);return'#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);}

function buildMap(){
  const th=world.theme,T=TDEF[th];const w=world.w,h=world.h;
  const cv2=document.createElement('canvas');cv2.width=w*TILE*RS;cv2.height=h*TILE*RS;const g=cv2.getContext('2d');g.scale(RS,RS);
  const r=seeded(4242+(world.z||0)*31+(th==='lobby'?7:0));
  const fa=world.fl,wl=world.wl,ac=world.ac;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!world.g[y][x])floorTile(g,T.fl,x*TILE,y*TILE,x,y,fa,ac,r);}
  // 벽 그림자
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(world.g[y][x]&&y+1<h&&!world.g[y+1][x]){const gr=g.createLinearGradient(0,(y+1)*TILE,0,(y+1)*TILE+6);gr.addColorStop(0,'rgba(0,0,0,.38)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x*TILE,(y+1)*TILE,TILE,6);}
    if(world.g[y][x]&&x+1<w&&!world.g[y][x+1]){g.fillStyle='rgba(0,0,0,.18)';g.fillRect((x+1)*TILE,y*TILE,3,TILE);}}
  // 장식
  world.lights=[];world.deco=[];
  const place=(name,x,y)=>{DECO[name](g,x,y,ac);if(name==='lamp')world.lights.push({x,y:y-7,r:46,col:th==='lobby'?'#fde68a':ac==='#f43f5e'?'#f43f5e':'#fef3c7',a:.5});if(name==='crystal')world.lights.push({x,y:y-3,r:26,col:'#4ade80',a:.6});if(name==='console')world.lights.push({x:x-1,y:y-1,r:14,col:ac,a:.45});};
  if(th==='lobby'){
    // 바닥 엠블럼
    g.save();g.globalAlpha=.25;g.fillStyle='#7fd1ff';g.beginPath();g.arc(15*TILE,8.5*TILE,30,0,6.28);g.fill();g.globalAlpha=.6;g.fillStyle='#0b1020';
    for(let i=0;i<3;i++){const a=i*2.094-1.57;g.beginPath();g.moveTo(15*TILE,8.5*TILE);g.arc(15*TILE,8.5*TILE,24,a-.5,a+.5);g.fill();}
    g.fillStyle='#7fd1ff';g.beginPath();g.arc(15*TILE,8.5*TILE,5,0,6.28);g.fill();g.restore();
    g.font='bold 7px sans-serif';g.fillStyle='rgba(159,227,255,.55)';g.textAlign='center';g.fillText('ALARA-VR TRAINING CENTER',15*TILE,8.5*TILE+42);g.textAlign='left';
    // 배너
    for(const bx of[4,11,19,26]){R(g,'#1e3a8a',bx*TILE,TILE*0+4,14,20);R(g,'#facc15',bx*TILE+5,TILE*0+10,4,4);R(g,'#1e40af',bx*TILE,24,14,2);}
    for(const[px,py]of[[1.6,1.8],[28.4,1.8],[1.6,15],[28.4,15],[11,8],[19,8]])place('plant',px*TILE,py*TILE);
    place('sofa',11*TILE,15.2*TILE);place('sofa',19*TILE,15.2*TILE);
    for(const[lx,ly]of[[4,2],[26,2],[4,14],[26,14],[15,2]])place('lamp',lx*TILE,ly*TILE);
  }else{
    const n=Math.floor(w*h/22);
    for(let i=0;i<n;i++){const tx=1+Math.floor(r()*(w-2)),ty=1+Math.floor(r()*(h-2));if(world.g[ty][tx])continue;if(Math.abs(tx-4)<4&&Math.abs(ty-h/2)<3)continue;
      const nm=T.deco[Math.floor(r()*T.deco.length)];place(nm,tx*TILE+8,ty*TILE+10);}
  }

  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(world.g[y][x])wallTile(g,T.wall,x*TILE,y*TILE,x,y,wl,ac,r,y>0&&world.g[y-1][x],y+1<h&&world.g[y+1][x]);}
  const n=parseInt(fa.slice(1),16),lum=((n>>16)*.3+(n>>8&255)*.59+(n&255)*.11)/255;world.lightMul=lum>.7?.18:lum>.5?.45:1;
  world.mapImg=cv2;world.amb=[];
}

function updateAmbient(dt){
  if(!world.amb)world.amb=[];const T=TDEF[world.theme],tp=T.amb;const cam=Game.camera;
  const want=Game.lowfx?10:tp==='star'?40:28;
  while(world.amb.length<want){const a={x:cam.x+rand(0,W),y:cam.y+rand(0,H),vx:0,vy:0,life:rand(2,6),max:6,s:rand(.8,2),ph:rand(0,6)};
    if(tp==='dust'){a.vx=rand(-4,4);a.vy=rand(-3,3);a.col='#ffffff';}
    if(tp==='spark'){a.vx=rand(-20,20);a.vy=rand(10,40);a.col='#fb923c';a.life=rand(.5,1.5);a.glow=1;}
    if(tp==='blue'){a.vx=rand(-3,3);a.vy=rand(-10,-3);a.col='#60a5fa';a.glow=1;}
    if(tp==='spore'){a.vx=rand(-3,3);a.vy=rand(-8,-2);a.col='#a3e635';a.glow=1;}
    if(tp==='steam'){a.vx=rand(-6,6);a.vy=rand(-14,-6);a.col='#e2e8f0';a.s=rand(4,9);a.steam=1;}
    if(tp==='bubble'){a.vx=rand(-2,2);a.vy=rand(-14,-6);a.col='#bae6fd';a.bub=1;}
    if(tp==='ember'){a.vx=rand(-4,4);a.vy=rand(-16,-6);a.col='#f87171';a.glow=1;}
    if(tp==='plasma'){a.vx=rand(-10,10);a.vy=rand(-10,10);a.col='#f472b6';a.glow=1;}
    if(tp==='star'){a.col='#ffffff';a.life=rand(1,4);a.tw=1;}
    if(tp==='glitch'){a.col=pick(['#f43f5e','#22c55e','#38bdf8']);a.life=rand(.1,.4);a.gl=1;a.s=rand(2,8);}
    world.amb.push(a);}
  for(const a of world.amb){a.x+=a.vx*dt+Math.sin(Game.t+a.ph)*.05;a.y+=a.vy*dt;a.life-=dt;if(a.x<cam.x-20||a.x>cam.x+W+20||a.y<cam.y-20||a.y>cam.y+H+20)a.life=0;}
  world.amb=world.amb.filter(a=>a.life>0);
}
function drawAmbient(){
  for(const a of world.amb){const al=clamp(Math.min(a.life,1),0,1);
    if(a.glow){drawGlow(ctx,a.x,a.y,a.s*3,a.col,al*.7);continue;}
    ctx.globalAlpha=al*(a.steam?.12:a.tw?(.4+.6*Math.abs(Math.sin(Game.t*3+a.ph))):a.bub?.5:.35);
    if(a.bub){ctx.strokeStyle=a.col;ctx.beginPath();ctx.arc(a.x,a.y,a.s,0,6.28);ctx.stroke();}
    else if(a.steam){C(ctx,a.col,a.x,a.y,a.s);}
    else if(a.gl){ctx.fillStyle=a.col;ctx.fillRect(a.x,a.y,a.s,1);}
    else{ctx.fillStyle=a.col;ctx.fillRect(a.x,a.y,a.s>1.5?2:1,a.s>1.5?2:1);}
  }ctx.globalAlpha=1;
}

function render(){
  const k=SCALE*devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(Game.scene!=='play'||!world){drawTitleBg(k);return;}
  if(!world.mapImg)buildMap();
  const sx=Game.shake>0?rand(-Game.shake,Game.shake):0,sy=Game.shake>0?rand(-Game.shake,Game.shake):0;
  ctx.setTransform(k,0,0,k,0,0);ctx.imageSmoothingEnabled=false;

  // skill slots (desktop)
  if(!isTouch){const pg=pageSkills();const sp=c.job?jobSpecial(c.job):null;
    const slot=(k,x,y,label)=>{ctx.fillStyle='rgba(8,12,20,.7)';ctx.fillRect(x,y,28,18);ctx.strokeStyle=P.page==='job'&&label!=='Alt'?'#facc15':'#3d5279';ctx.strokeRect(x+.5,y+.5,27,17);
      ctx.font='5px sans-serif';ctx.fillStyle='#ffd479';ctx.fillText(label,x+2,y+6);
      if(!k)return;const S=SKILLS[k];const lock=c.lv<S.lv;ctx.fillStyle=lock?'#64748b':'#fff';ctx.textAlign='center';ctx.fillText(lock?'🔒Lv'+S.lv:S.n.slice(0,5),x+14,y+13);ctx.textAlign='left';
      const cd=P.cds[k];if(cd>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y,28,18*Math.min(1,cd/(S.cd*s.cd)));ctx.fillStyle='#fff';ctx.font='bold 7px sans-serif';ctx.fillText(Math.ceil(cd),x+11,y+11);}
      if(P.mp<S.mp&&!lock){ctx.fillStyle='rgba(30,60,160,.35)';ctx.fillRect(x,y,28,18);}};
    let hov=null;const M=Game.mouse;const chk=(k,x,y)=>{if(k&&M&&M.x>=x&&M.x<=x+28&&M.y>=y&&M.y<=y+18)hov={k,x};};
    for(let i=0;i<4;i++){slot(pg[i],W/2-78+i*31,H-22,KEYS4[i]);chk(pg[i],W/2-78+i*31,H-22);}
    slot(sp,W/2-78+4*31+6,H-22,'Alt');chk(sp,W/2-78+4*31+6,H-22);
    if(hov)drawSkillTip(hov.k,hov.x);
    ctx.font='5px sans-serif';ctx.fillStyle=P.page==='job'?'#facc15':'#9fe3ff';ctx.fillText(P.page==='job'&&c.job?'[Tab] 직업 스킬':'[Tab] 공통 스킬',W/2-78,H-25);
    }
  if(!isTouch&&!Game.hideKeys)drawKeyGuide();
  // buffs
  let bx=6;for(const k in P.buffs){if(k==='toggleOn'){if(!P.buffs.toggleOn)continue;}const n={shield:'방패',haste:'신속',allnight:'밤샘',paper:'논문',smear:'스미어',colli:'콜리',thesis:'무적',pad:'흡착',toggleOn:'ON',xvision:'투시',coffee:'커피',guard:'방호'}[k];if(!n)continue;ctx.fillStyle='rgba(8,12,20,.7)';ctx.fillRect(bx,54,22,9);ctx.fillStyle='#9fe3ff';ctx.font='5px sans-serif';ctx.fillText(n,bx+2,60.5);bx+=24;}
  if(P.potCd>0){ctx.fillStyle='#94a3b8';ctx.font='5px sans-serif';ctx.fillText(`포션 ${Math.ceil(P.potCd)}s`,bx+2,60.5);}
  // interact hint
  const o=nearestObj();if(o){ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.7)';const tx=`[Z] ${o.name}${o.sub?' — '+o.sub:''}`;const w=ctx.measureText(tx).width+8;ctx.fillRect(W/2-w/2,H/2+18,w,11);ctx.fillStyle='#fde047';ctx.fillText(tx,W/2,H/2+26);ctx.textAlign='left';}
  // toasts
  Game.msg.forEach((m,i)=>{ctx.globalAlpha=clamp(m.life,0,1);ctx.font='7px sans-serif';const w=ctx.measureText(m.t).width+8;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(W/2-w/2,64+i*11,w,10);ctx.fillStyle=m.col;ctx.textAlign='center';ctx.fillText(m.t,W/2,71.5+i*11);ctx.textAlign='left';});ctx.globalAlpha=1;
  if(Game.banner){const b=Game.banner;ctx.globalAlpha=clamp(b.life,0,1);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-46,W,30);ctx.textAlign='center';ctx.font='bold 12px sans-serif';ctx.fillStyle='#fde047';ctx.fillText(b.t,W/2,H/2-30);ctx.font='6.5px sans-serif';ctx.fillStyle='#fff';ctx.fillText(b.s,W/2,H/2-20);ctx.textAlign='left';ctx.globalAlpha=1;}
}
function wrapText(t,maxW){const out=[];let line='';for(const ch of t){const tl=line+ch;if(ctx.measureText(tl).width>maxW&&line){out.push(line);line=ch;}else line=tl;}if(line)out.push(line);return out;}
function drawSkillTip(k,sx){
  const S=SKILLS[k],c=Game.char;const w=150;ctx.font='5.5px sans-serif';
  const d=wrapText(S.d,w-8),tp=wrapText('💡 '+(TIPS[k]||''),w-8);const h=22+(d.length+tp.length)*7;
  const x=clamp(sx-w/2+14,4,W-w-4),y=H-26-h;
  ctx.fillStyle='rgba(8,12,24,.94)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#4b86f0';ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.font='bold 7px sans-serif';ctx.fillStyle='#9fe3ff';ctx.fillText(S.n,x+4,y+9);
  ctx.font='5px sans-serif';ctx.fillStyle='#ffd479';ctx.fillText(`${keyOf(k)} · MP ${S.mp} · 쿨 ${S.cd}초${c.lv<S.lv?' · 🔒 Lv.'+S.lv:''}`,x+4,y+16);
  ctx.font='5.5px sans-serif';ctx.fillStyle='#fff';d.forEach((l,i)=>ctx.fillText(l,x+4,y+23+i*7));
  ctx.fillStyle='#a7f3d0';tp.forEach((l,i)=>ctx.fillText(l,x+4,y+23+(d.length+i)*7));
}
function drawKeyGuide(){
  const rows=[['←↑↓→','이동'],['Ctrl','기본 공격'],['Q W E R','스킬'],['Tab','스킬 탭 전환'],['Alt','직업 특수 스킬'],['Space','대시'],['Z','대화·조사'],['Shift','HP 포션'],['1 / 2','MP 포션 / 제염'],['Esc','메뉴'],['H','이 안내 숨기기']];
  const x=4,h=8.2,y0=H-rows.length*h-8;
  ctx.fillStyle='rgba(8,12,20,.6)';ctx.fillRect(x-2,y0-9,92,rows.length*h+12);
  ctx.font='bold 5.5px sans-serif';ctx.fillStyle='#9fe3ff';ctx.fillText('조작키',x+1,y0-2.5);
  rows.forEach((r,i)=>{const y=y0+i*h;ctx.font='bold 5px sans-serif';const w=ctx.measureText(r[0]).width+5;
    ctx.fillStyle='#e2e8f0';ctx.fillRect(x,y,w,6.5);ctx.fillStyle='#94a3b8';ctx.fillRect(x,y+6,w,1);
    ctx.fillStyle='#0f172a';ctx.fillText(r[0],x+2.5,y+5);
    ctx.font='5px sans-serif';ctx.fillStyle='#fff';ctx.fillText(r[1],x+w+3,y+5);});
}
function drawTitleBg(k){
  ctx.setTransform(k,0,0,k,0,0);const t=performance.now()/1000;
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b1020');gr.addColorStop(1,'#14213d');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const x=(i*73+t*10*(i%3+1))%W,y=(i*37)%H;ctx.fillStyle=i%5?'#3b82f6':'#84cc16';ctx.globalAlpha=.3+.3*Math.sin(t*2+i);ctx.fillRect(x,y,2,2);}ctx.globalAlpha=1;
  ctx.fillStyle='rgba(132,204,22,.15)';ctx.font='120px sans-serif';ctx.textAlign='center';ctx.fillText('☢',W/2,H/2+40);ctx.textAlign='left';
}

/* ---------------- boot ---------------- */
resize();setupTouch();showLogin();requestAnimationFrame(loop);
window.__game={Game,get P(){return P;},get world(){return world;},enterZone,spawnMob,castSkill,stats,CERTS,ZONES,SKILLS,showJobChange,interact,leaderboard};
</script>
